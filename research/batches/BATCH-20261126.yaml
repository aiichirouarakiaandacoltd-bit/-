  summary: '冒頭30秒: ①11/20 のご会見の写真(宮内庁の掲載待ち。載るまでは 11/11 の写真) ②数字「1か月で4つの国」 ③疑問「なぜ、お迎えの形がそれぞれ違うのか」 ④「宮内庁と外務省の記録で、4つの場面をたどります」。答え(全体の4割まで): 外務省の招へいの区分(国賓/公賓/公式実務訪問賓客 ほか)で、宮中行事の有無が決まっている。ベトナムは宮内庁の表記どおり「公式実務訪問賓客」で宮殿でご会見・午餐、チリは外務省の発表で公式実務訪問、タイ王妃は御所での「お茶」(区分は G1 で確認。確認できなければ「記録に区分の記載なし」と言う)。比較の物差しとして、国賓の例(令和8年5月 フィリピン大統領ご夫妻の歓迎行事・宮中晩餐=宮内庁の写真あり)を並べる。後半の次の疑問: 「それぞれの場で、両陛下は何を伝えられたのか」→ 報道で確認できる範囲(陛下のスペイン語のごあいさつ、ベトナムとの午餐の乾杯など)を「報道によると」と明示。10/28 にペルーの新しい大使の信任状捧呈式があったこと(宮内庁)も時間の比較で添える。締め: 「皆さまの心に残ったのは、どの国とのお迎えですか。」'
  question: この秋、両陛下が外国の賓客をお迎えになった形は、なぜ「ご会見」「午餐」「お茶」と違うのか？
  answer: 政府の招へいの区分(外務省)によって宮中行事の有無が決まっている。ベトナムは公式実務訪問賓客として宮殿でご会見・午餐(宮内庁)。ほかの3つの区分と形は G1 で宮内庁・外務省の記録で確定させる
  length: 8〜9分
  five_elements:
    強い疑問: 同じ秋のお迎えで、なぜ形が「ご会見」「午餐」「お茶」と違うのか
    確認できる事実: 宮内庁ご日程(10/20・10/28・11/11・11/19〜21)と写真説明、外務省の招へい区分の説明・各国の訪問の発表
    人物の物語: 両陛下が宮殿・御所で外国の方を迎え続けてこられた歩み(国賓 フィリピン 5月 → この秋の4組)
    比較: 制度の比較(国賓と公式実務訪問賓客、宮中晩餐と午餐)と時間の比較(10/28 ペルー大使 → 11/20 ペルー大統領)。事実×事実のみ
