  summary: '冒頭30秒: ①成年の記者会見の写真 ②令和3年12月1日のご感想の一節「できる限り両陛下をお助けしていきたいと考えております。」 ③疑問「それから5年、どんな『初めて』があったのか」 ④「宮内庁の記録にある『初めて』を、年の順にたどります」の1文。

    1つの疑問と答え(3分30秒まで): 成年皇族として初めての新年祝賀の儀(成年会見でのお言葉)、ご就職(令和6年4月)、初めてお一人での地方公務(令和6年10月・佐賀県)、初めての能登の被災地ご訪問と初めての外国公式訪問ラオス(令和7年)、2度目の外国公式訪問シンガポール(令和8年11月)。いずれも宮内庁の文章に「初めて」「2度目」と書かれているものだけを数える。

    後半の次の疑問: 「その歩みを、ご両親はどう語られてきたのか」。雅子さまの令和6・7年のご感想、陛下のお誕生日会見、成年会見で愛子さまが両陛下へ語られたお言葉へ。

    締めくくりの問いかけ:「皆さまの心に残ったのは、愛子さまのどの『初めて』ですか。」

    '
  question: 成年のご感想「できる限り両陛下をお助けしていきたい」から5年、愛子さまにはどんな「初めて」があったのか？
  answer: 宮内庁の文章に「初めて」「2度目」と書かれた節目を年の順に並べる(成年会見・皇后陛下のご感想 令和6〜7年・シンガポールご訪問のご感想)
  five_elements:
    強い疑問: 成年から5年、どんな「初めて」があったのか？
    確認できる事実: 愛子内親王殿下ご成年に当たってのご感想(令和3年12月1日)/成年の記者会見(令和4年3月17日)/ご就職の文書回答/皇后陛下のご感想 令和6・7年/シンガポールご訪問のおことば・ご感想
    人物の物語: 「人の役に立つことのできる大人に」と書かれた20歳から、2度の外国公式訪問を終えた25歳へ
    比較: 同じ方の歩みの比較(初めてのお務めと今回、ラオスとシンガポール)
    独自の解説: 公式の文章に出てくる「初めて」を拾って年表にする(分析と分かる言い方)
