  risks: ①令和8年のご感想は12/9まで出ない(本編は7回で完結させる。「7回」は公開日時点で正しい数)。②平成14年の原文は「生まれてきてありがとう」、令和4年の愛子さまのお言葉の中では「生まれてきてくれてありがとう」。2つを混ぜずにそれぞれ原文どおり使う(C案の題名は平成14年の原文に合わせた)。③ご近影の令和元〜4年は画像が小さい可能性(拡大の限度は G2 で実測)。④ご近影の1枚ごとに写っている方を目視で確かめる。⑤ご感想には療養・体調に触れる段落がある。病気の話題は扱わない(本書1章の禁止)。⑥既作ショート
    01・06 は陛下の会見が出典で、本企画は雅子さまのご感想が出典。同じ出来事の重複には当たらない
