    kind: 人物の物語型(主役=母と娘が20年を隔てて交わされた言葉)
    title: '【母と娘の20年】雅子さまの「生まれてきてありがとう」に、成年を迎えた愛子さまが会見で返された言葉とは？ #雅子さま #愛子さま #皇室'
