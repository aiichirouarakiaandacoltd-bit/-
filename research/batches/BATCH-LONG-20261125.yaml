    photo: 愛子内親王殿下ご成年の記者会見(令和4年3月17日)の写真と、平成14年4月2日の会見の写真(キャプションに「写真：宮内庁」)
  summary: '冒頭30秒: ①雅子さまと愛子さまのご近影 ②令和3年のご感想の一節「あの幼かった愛子がもう成年かと思いますと，信じられないような気持ちもいたします。」 ③疑問「皇后として7回のお誕生日のご感想に、愛子さまのことを何と書かれてきたのか」 ④「宮内庁が公表している全文を、年の順にたどります」の1文。

    1つの疑問と答え(全体の4割=3分30秒〜4分まで): 7回のうち6回(令和元・2・3・5・6・7年)、その年の愛子さまの節目(高校3年生・大学入学・成年・大学4年生・ご就職と初めてお一人での地方公務・初めての外国公式訪問)を書かれ、令和3・6・7年は「見守っていただけましたら」と結ばれている。令和4年は愛子さまへの言及がない。

    後半の次の疑問: 「では、愛子さまは母に何と語られたのか」。成年の記者会見(令和4年3月17日)の「母の「生まれてきてくれてありがとう」という言葉に掛けて，私も「生んでくれてありがとう」と伝えたいと思います。」へ進み、平成14年4月2日の会見の「本当に生まれてきてありがとうという気持ちで一杯になりました。」までさかのぼる。

    終盤: 令和7年のご感想のラオス、今年のシンガポールご訪問(愛子さまのご感想「私にとって2度目の外国公式訪問」)に触れ、まとめ→意味づけ→問いかけ。

    章の見出し(案): 「あの幼かった愛子が」と書かれた年/7回のうち6回、何が書かれていたのか/1回だけ書かれなかった年/愛子さまが母に返された言葉/20年前、同じ言葉が語られた会見。

    締めくくりの問いかけ:「皆さまの心に残ったのは、どの年のお言葉ですか。」

    '
  question: 皇后として7回のお誕生日のご感想のうち6回、雅子さまは愛子さまについて何を書かれてきたのか？
  answer: その年の愛子さまの節目と、成長への願い・見守る方々への感謝(令和元・2・3・5・6・7年のご感想全文で確認。令和4年は言及なし)
  five_elements:
    強い疑問: 7回のご感想のうち6回、愛子さまについて書かれたこととは？
    確認できる事実: 宮内庁 皇后陛下お誕生日に際してのご感想 令和元〜7年の全文/愛子内親王殿下ご成年の記者会見(令和4年3月17日)/愛子内親王殿下御誕生につき記者会見(平成14年4月2日)
    人物の物語: 高校3年生から成年、ご就職、外国公式訪問へ。母の言葉に残った娘の7年と、娘から母への言葉
    比較: 同じ方の同じ文書を年ごとに並べる(時間の比較)。平成14年の母の言葉と令和4年の娘の言葉(20年を隔てた事実×事実)
    独自の解説: 7回分を並べて、書かれた年・書かれなかった年・くり返される結びの言い方を整理する(分析と分かる言い方)
