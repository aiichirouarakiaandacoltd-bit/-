  prior_videos: '該当37本・中央値16,326回。上位: TBS「あの幼かった愛子が」195万(4年前・表紙は母と娘のお二人)/テレ東BIZ 59歳のご感想 75万/同 還暦 25万/Beちゃんねる 21万/皇室日記帳 20.6万。深掘りデータでは 皇室と共に歩む「雅子さま62歳のお誕生日」36万(写真のみ・19分・同チャンネル中央値の63倍)。下位は作り台詞の表紙か、1名の切り抜き+説明の文字。「母と娘のありがとう」だけを軸にした回は
    3,165回・718回・7回と低いので題名Aの主役にしない(C案で試す)'
  growth_basis: '事実: お誕生日の題材は競合31本の中央値5.9万回(題名に「誕生日」を含む回の再集計。対立型も含む)。写真のみの回で36万の実例。題名に実際の音声を掲げた回は中央値比2.72倍(40本)で、当方の対応物は宮内庁原文のお言葉。推測(確度 中): 12/9の前後1週間は「雅子さま 誕生日」の検索と関連表示が増える。意見: 期待値は数千〜数万回、当たれば10万回台'
