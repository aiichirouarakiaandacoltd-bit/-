- id: S6
  title: '【シンガポール】愛子さまがご感想に「受け継いでいくことができれば」と書かれたものとは？ #愛子さま #シンガポール #皇室'
  summary: '令和8年11月21日 シンガポールご訪問を終えてのご感想(宮内庁原文)。答えは1970年に上皇ご夫妻(当時の皇太子同妃両殿下)が植えられたソテツと、その隣へのフクギの植樹など(原文で確認できる範囲)。現地写真がないので場所の写真(Commons)とおことばの画面で。最後に長尺へ誘導。'
  type: A型・45〜60秒
  status: 承認済
  approved_at: '2026-11-26'
  approved_by: 荒木さん
