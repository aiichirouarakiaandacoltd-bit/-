made_by: 進行役(荒木さん提案「愛子さまの誕生日へ向けてこれまでの軌跡を追う動画」)
basis: '愛子さま25歳のお誕生日(12/1)向け。柱は愛子さまご自身の言葉(宮内庁原文: 成年のご感想・成年会見・ご就職の文書回答・ラオス/シンガポールのおことば・ご感想)と宮内庁の記録にある「初めて」。L4(雅子さまのご感想)・R1(陛下の会見)・S1(成年会見「生んでくれて」)と主役を重ねない。報道映像は使わない。シンガポールは写真がないので最終章に置き、おことばの大きな画面と場所の写真(Commons)で。公開想定: ショート 11/28〜30、長尺 12/1。'
items:
- id: A25
  title: '【愛子さま25年の軌跡】ご誕生から2度目の外国公式訪問まで ご自身が語られた言葉でたどる #愛子さま #皇室 #天皇ご一家'
  ab_tests:
  - id: A
    title: '【愛子さま25年の軌跡】ご誕生から2度目の外国公式訪問まで ご自身が語られた言葉でたどる #愛子さま #皇室 #天皇ご一家'
  - id: B
    title: '【愛子さま25歳のお誕生日】成年から5年、宮内庁の記録に残る「初めて」はいくつあったのか？ #愛子さま #皇室 #天皇ご一家'
  - id: C
    title: '「私も受け継いでいくことができれば」 愛子さま25歳 シンガポールのご感想と、成年から歩まれた道 #愛子さま #皇室'
  summary: '冒頭: シンガポールのご感想の一節「私も受け継いでいくことができれば」を大きく→疑問「この言葉に至るまで、どんな『初めて』を重ねてこられたのか？」。答え(4分まで): 宮内庁の記録の「初めて」を年の順に(成年 令和3年・初めての記者会見 令和4年・ご卒業とご就職 令和6年・初めてお一人での地方公務 令和6年佐賀・能登 令和7年・初めての外国公式訪問 ラオス 令和7年・2度目 シンガポール 令和8年)。後半の疑問: 「その時々に、どんな言葉を残されたのか」→成年のご感想・就職の文書回答・ラオス/シンガポールのおことばを並べる。締め: 25歳の今。約10分。荒木さんの指定で題名は「25年の軌跡」(ABテストの最初)。'
  status: 承認済
  approved_at: '2026-11-26'
  approved_by: 荒木さん
  note: 荒木さん「Bでいく、誘導ショート動画3本も同時に制作しなさい」2026-11-26。完成まで承認不要。
- id: S4
  title: '【ラオス】愛子さまが初めての外国公式訪問で述べられたおことばの一節とは？ #愛子さま #ラオス #皇室'
  summary: '令和7年11月 ラオスご訪問(初めての外国公式訪問)のおことば(宮内庁原文)から一節を答えに。1本=1場面。最後に長尺へ誘導(日付なし)。'
  type: A型・45〜60秒
  status: 承認済
  approved_at: '2026-11-26'
  approved_by: 荒木さん
