batch: BATCH-LONG-REWRITE-20261125
created: '2026-11-25'
made_by: 進行役(競合長尺のリライト・荒木指示)
basis: 'リライト元: 日本一新 受け継がれる精神「「仕事経験のない私に…」陛下が会見で語られた愛子さまの一年」(https://www.youtube.com/watch?v=g8Xy5fGC43A・100.5万回・18:41・2026-05-08)。荒木さん提供の文字起こしあり(チャット)。借りるのは題材と構成(陛下のお誕生日会見のお言葉を柱に1年の出来事を当てる)だけ。文言・沿道の声・撮影者の感想・電車の推測・報道の逸話・雅子さまの体調の段落・内心の断定は使わない。事実は宮内庁の会見全文・ご日程で確認できるものだけ。'
items:
- id: R1
  title: '【天皇陛下のお誕生日会見】言わば「未知の旅」のように 陛下がそう語られた、愛子さまのお話とは？ #天皇陛下 #愛子さま #皇室'
  ab_tests:
  - id: A
    title: '【天皇陛下のお誕生日会見】言わば「未知の旅」のように 陛下がそう語られた、愛子さまのお話とは？ #天皇陛下 #愛子さま #皇室'
  - id: B
    title: '【社会人3年目へ】日本赤十字社で働く愛子さまの1年 陛下が会見で語られた4つのお言葉とは？ #愛子さま #天皇陛下 #皇室'
  - id: C
    title: '【陛下が語られたご家族】「愛子と3人で過ごす時間」 お誕生日会見で明かされた天皇ご一家の1年とは？ #天皇陛下 #雅子さま #愛子さま'
  summary: '冒頭: 会見の写真+お言葉「いわば未知の旅のように感じられ」を大きく見せ、「陛下にとって何が未知の旅なのか？」。答え(3分台): 愛子さまが職場(日本赤十字社)から持ち帰られるお話と、「社会で仕事を経験したことのない私にとっては」という陛下ご自身の立場の対比。後半の疑問: 「愛子さまはこの1年、どんな経験を重ねられたのか」→ 能登・新潟の防災推進国民大会など宮内庁の記録にある出来事を年の順に。締め: 「愛子と3人で過ごす時間は…」。尺約9分。お言葉は会見全文で一字一句(引用は原文の表記どおり)。'
  status: 承認済
  approved_at: '2026-11-25'
  approved_by: 荒木さん
  note: 荒木さん「承認」2026-11-25。完成まで承認不要。
