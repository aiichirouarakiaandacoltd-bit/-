    kind: 実際のお言葉型(主役=千葉大学の式典でのおことば)
    title: '【愛子さまのおことば】「看護師のすばらしさを感じてまいりました」 25歳を迎える愛子さまが式典で語られたご自身の経験とは？ #愛子さま #おことば #皇室'
