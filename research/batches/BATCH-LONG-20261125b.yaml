    photo: 令和8年10月29日 園遊会「ご歓談になる愛子内親王殿下」(和装・屋外)。手前の招待者の後ろ姿が入らない範囲に切り抜く(切り抜けなければ令和7年のご近影の机に向かわれる1枚)
  summary: '冒頭30秒: ①令和6年のご近影(皇居東御苑) ②数字「18歳から24歳まで、7回」 ③疑問「お誕生日のご近影は、毎年どこで撮られてきたのか」 ④「宮内庁が公開している7年分を、年の順にたどります」の1文。

    1つの疑問と答え(3分30秒まで=全体の4割): 宮内庁のページの説明では、22歳(令和5年)は書陵部、23歳(令和6年)は皇居東御苑と御所、24歳(令和7年)は御所。18〜21歳(令和元〜4年)のページには場所の記載がない(報道で確かめられた年だけ場所を言い、確かめられない年は「記載なし」と言う)。年ごとに、その年の節目(高校3年生・大学入学・成年・大学4年生・ご就職・初めての外国公式訪問)を1つずつ添える。

    後半の次の疑問: 「ご近影の外で、24歳の1年に何を語られたのか」。式典でのおことば3件(千葉大学看護学部・半導体物理国際会議・世界医学検査学会)とシンガポールの午餐会のおことばで計4回。千葉大学では「私は、幼少の頃より折に触れて、看護師の的確な判断や対象者の意をくんだ臨機応変な対応に接し、相手の心身に寄り添う誠実な姿勢に、看護師のすばらしさを感じてまいりました。」と述べられた。続けてご一家でのお出まし(福島・園遊会ほか)の写真。

    章の見出し(案): 18歳のご近影に写っていたのは/22歳、なぜ書陵部だったのか(記録で言える範囲)/23歳、皇居東御苑の木の下で/24歳の1年に語られた4回のおことば/25歳の日に。

    締めくくりの問いかけ:「皆さまの心に残ったのは、何歳のご近影ですか。」'
  question: 愛子さまのお誕生日のご近影は、18歳から24歳まで毎年どこで撮られてきたのか？
  answer: 令和5年は書陵部、令和6年は皇居東御苑と御所、令和7年は御所(宮内庁のページの説明)。令和元〜4年は宮内庁のページに場所の記載がなく、G1 で報道から確認できた分だけ言う
