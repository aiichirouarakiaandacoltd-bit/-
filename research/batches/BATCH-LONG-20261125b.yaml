    確認できる事実: 宮内庁 愛子内親王殿下のお誕生日に際してのご近影 令和元〜7年の7ページ/愛子内親王殿下のおことば 令和7・8年/シンガポールご訪問時のおことば
    人物の物語: 高校3年生の18歳から、2度の外国公式訪問を終えた24歳まで
    比較: 同じ方の同じ日のご近影を年ごとに並べる(時間の比較)。23歳の1年と24歳の1年のおことばの回数
    独自の解説: 7年分の撮影の場所と、その年の節目を1つの年表に整理する(分析と分かる言い方)
