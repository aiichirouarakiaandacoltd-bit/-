  title_length: 67
  question: 新任の大使が皇居へ向かう時、自動車と馬車のどちらを選ぶ大使が多いのか？
  answer: 馬車。宮内庁「新任大使の送迎に馬車を使用している国は、世界的に見ても英国やスペインなど数か国ですが、我が国の場合、自動車より馬車を希望する大使が多く、国際親善の実を挙げています。」
  summary: '冒頭: 松の間で信任状を受けられる陛下+疑問。事実: 大使の希望で皇室用の自動車か馬車(宮内庁)→東京駅から宮殿南車寄までの経路→儀装馬車4号(大正2年
    国内で製造、2頭曳の座馭式、昭和60年の文仁親王成年式・令和7年の悠仁親王成年式でも使用)。前置き+答え。比較: 令和8年は 11/26 までに少なくとも13回(ご日程で確認できた12回+11/26)。意味づけ:
    外国の大使を迎える最初の日に、明治・大正からの馬車が今も使われているのかもしれません。問いかけ: 「皆さまは、皇居の馬車列をご覧になったことはありますか。」'
