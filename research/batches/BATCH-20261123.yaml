batch: BATCH-20261123
created: '2026-11-23'
made_by: 企画係
basis: >-
  R1: 宮内庁 新着(最新11/20)・2026nld-bel(オランダ・ベルギー国賓訪問 6/13〜6/26 写真28ページ93枚)・令和8年オランダ・ベルギーご訪問に際しての記者会見・お誕生日会見(令和2〜8年)。
  R2: vidIQ実測(11/23)皇室ヴェール「マチルド王妃が雅子さまへ駆け寄った理由」148万・「オランダ…雅子さまに贈ったエール」142万・「陛下を気遣う雅子さま…オランダ関係者」37万・「アレクサンダー国王と笑い合う」35万/皇室秘話室「両陛下とオランダ国王夫妻 別れ際」10.9万/人生の心つづり 会見の言葉 型。
  当方の差別化: 相手の内心を断定せず、宮内庁の記録と会見全文だけで答える(第1-2章・第1-6-2章)。
items:
- id: N1
  title: "【オランダ国王一家と両陛下】20年前にご一家で過ごした夏…陛下が会見で語られた思い出とは？宮内庁の記録から #天皇陛下 #雅子さま #オランダ"
  summary: "令和8年6月の国賓ご訪問を前にした記者会見で、陛下が語られた、かつてのご一家でのオランダ滞在と国王一家との家族ぐるみの交流(会見全文で一字一句)。ご訪問(歓迎式典・晩餐会・お別れ)の写真で、20年前から今回までをたどる。締めくくりは『皆さまの心に残ったのは、どの場面ですか』。"
  type: B型(人物×過去×現在)・解説型60〜75秒
  factors: 1・2・3・5
  evidence: 令和8年 オランダ・ベルギーご訪問に際しての記者会見(全文)・2026nld-bel 各ページ。滞在の年(平成18年)などはG1で確認
  photos: 宮内庁 2026nld-bel 93枚(オランダ分 約50枚)+会見の写真1枚
- id: N2
  title: "【ベルギー国王夫妻と両陛下】お別れの日、ラーケン宮で両陛下が国王夫妻と過ごされた時間とは？宮内庁の記録から #天皇陛下 #雅子さま #ベルギー"
  summary: "6月25日、ラーケン宮のご散策と国王王妃両陛下とのお別れの一場面。歓迎式典(6/23)・晩餐会(ラーケン宮)からお別れまでを、写真の説明だけでたどる(会話の中身は記録にあるものだけ)。"
  type: A型(行事×一場面×疑問)・一瞬型〜解説型40〜60秒
  factors: 1・2・3
  evidence: 2026nld-bel 20260625-01・20260623-01・20260623-05 の写真説明
  photos: 宮内庁 15枚前後(お別れ5・歓迎式典5・晩餐会5)
- id: N3
  title: "【オランダの森に桜】両陛下がアムステルダムで植えられた木とは？日本とオランダの交流の証し #天皇陛下 #雅子さま #オランダ"
  summary: "6月19日、アムステルダムの森公園での桜の植樹。なぜオランダに桜なのか(公園にある日本ゆかりの桜の記録)をG1で確認できる範囲で解説。前後のご日程(平和宮・ライデン大学)の写真も使う。"
  type: A型・一瞬型〜解説型30〜60秒
  factors: 1・3・5
  evidence: 2026nld-bel 20260619-02 の写真説明。公園の桜の由来は公的な記録で確認できなければ言わない
  photos: 宮内庁 3枚+同日・前日の行事 約15枚
- id: N4
  title: "【雅子さまと子どもたち】オランダ王妃の名前が付いた病院で、両陛下が訪ねられた子どもたちとは？宮内庁の記録から #雅子さま #天皇陛下 #オランダ"
  summary: "6月19日、プリンセス・マキシマ小児がんセンターのご訪問。施設名の由来(王妃の名)と、両陛下が子どもたち・家族と過ごされた場面を写真の説明でたどる。"
  type: A型・解説型40〜60秒
  factors: 1・2・3
  evidence: 2026nld-bel 20260619-01 の写真説明。施設名の由来は施設の公式情報で確認
  photos: 宮内庁 5枚+同日の行事 約8枚
- id: N5
  title: "【天皇陛下から愛子さまへ】即位後7回のお誕生日会見で語られた、娘・愛子さまへの言葉とは？宮内庁の会見記録から #天皇陛下 #愛子さま #皇室"
  summary: "家族の言葉 第2弾(KB-20261123-01 の姉妹編)。大学生→社会人→初の外国公式訪問と、陛下が会見で語られた愛子さまの成長を年の順に(会見全文で一字一句)。12月1日の愛子さまのお誕生日の前後に向く。"
  type: B型・解説型60〜75秒
  factors: 1・2・5
  evidence: 天皇陛下お誕生日会見 令和2〜8年(全文取得済み)
  photos: 宮内庁 令和8年の愛子さまのご公務・ご近影(KB-20261121-01・KB-20261123-01の台帳と重ならない写真を優先)
