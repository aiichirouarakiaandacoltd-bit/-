  photos: 報告 UnitedKingdom1〜7 に53枚(長辺1000px・実測)。うちオックスフォードは7枚(47〜53)。ご日程 2024gbr は19ページ35枚だが400pxのため補助。オックスフォード当日の素材は写真7枚+映像28秒で、当日の章(約4分)は不足気味
  competitors: 'ANNnewsCH「思い出のオックスフォード」987,163回(7:43・2年前)/日テレNEWS 全記録「思い出の地にふたりで」970,999回(34:26・2年前)/TBS「皇后さまに名誉法学博士号」223,802回(5:15・2年前)/日テレNEWS
