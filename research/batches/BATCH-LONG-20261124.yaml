  summary: '10月29日、赤坂御苑で秋の園遊会が催された。宮内庁の説明では、園遊会は毎年春と秋の2回、各界の功績者や三権の要人など約2,000人が配偶者とともに招かれる。

    ご臨場、招待客とのご歓談、楽部の管弦と皇宮警察音楽隊の演奏、会場の花々、オードブルと飲み物まで、宮内庁の写真・報告・公式映像で一日の流れを追う。

    春(4月17日)の報告と秋の写真・映像を並べ、同じ年の2回を比べる。

    章立ての目安: 0:00 疑問と秋の場面/0:30 この動画で分かること/1:00 園遊会とは(年2回・招かれる人)/2:30 ご臨場/3:30 両陛下のご歓談/5:00
    愛子さま・皇族方のご歓談/6:00 演奏・花・料理/7:00 春と秋を並べる/8:00 前置き→答え・まとめ・問いかけ。

