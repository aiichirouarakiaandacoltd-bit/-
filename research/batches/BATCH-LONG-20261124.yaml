    264,857回/皇室秘録 109,193回/雅の記憶 99,250回/日本を愛で包む 82,988回。取得 2026-11-24。伸びる理由(分析): 王室どうしの縁と、おことばそのものへの関心'
  risks: 既作ショート KB-20261123-03(ベルギー国王ご夫妻とのお別れ)と同じご訪問。本企画は晩餐会のおことばと交流の歩みが軸で、お別れの場面は終盤で短く触れるだけにする(長尺での深掘り)。昭和天皇・上皇陛下の時代の写真が宮内庁にあるかは未確認(無ければ4〜6分の章は今回の写真に撮影日を表示して当てることになり、言葉と画像の一致が弱くなる)。エリザベート王女が晩餐会に出席されたか・写真があるかは未確認。愛子さまは今回同行されていない。5か月前の出来事
