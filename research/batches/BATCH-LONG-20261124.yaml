  summary: '令和8年6月23日、ベルギー国王王妃両陛下主催の晩餐会で、陛下は両王室の「四世代にわたるご縁」に触れられた。

    おことば全文によると、レオポルド3世国王と昭和天皇は1901年の同い年、アルベール2世国王と上皇陛下は1934年と33年の1年違い、フィリップ国王と陛下は1960年の同い年、エリザベート王女と愛子さまは2001年の同い年。

    この一節を軸に、おことばに述べられた交流の歩みと、ベルギーご訪問(6/20〜25)の足取りを公式記録でたどる。

    章立ての目安: 0:00 疑問と晩餐会の場面/0:30 この動画で分かること/1:00 ご訪問の全体(オランダからベルギーへ)/2:00 歓迎式典・ブリュッセル市庁舎・連邦議会/3:30
    晩餐会とおことば/4:30 一世代目 昭和天皇/5:30 二世代目 上皇陛下/6:30 三世代目 陛下(英国留学中のご交流)/7:30 四世代目 愛子さま/8:30
    前置き→答え/9:00 翌日以降(ナミュール・ルーヴェン大学・お別れ)/10:00 まとめ・意味づけ・問いかけ。

    締めくくりの問いかけ:「皆さまの心に残ったのは、四世代のうちどの世代のお話ですか。」

    '
  question: 陛下がベルギーの晩餐会で語られた「四世代にわたるご縁」とは？
  answer: 両王室の四世代が、同い年または1年違いの生まれであること(1901年/1934年と33年/1960年/2001年)。おことば全文に記載
  five_elements:
    強い疑問: 「四世代にわたるご縁」とは？
    確認できる事実: 宮内庁 おことば 2026nld-bel(ベルギー国王王妃両陛下主催晩餐会)・ご日程 2026nld-bel・報告 nld-bel1 ほか
    人物の物語: 昭和天皇から陛下、そして愛子さまの世代へ受け継がれる王室との交流
    比較: 四つの世代の生まれ年(事実×事実)と、おことばに述べられた過去の交流と今回のご訪問(時間の比較)
    独自の解説: 国賓としての訪問で晩餐会のおことばが担う役割(分析と分かる言い方)
