    お二人の留学の地という物語と、雅子さまの国際経験への関心'
  risks: 2年前の出来事で時事性は低い(12/9 皇后さまお誕生日の前に向く)。陛下が名誉法学博士号を受けられた年と、お二人の留学の年は宮内庁のご略歴でG1確認(未確認)。オックスフォード当日の公式素材が少ないため、留学当時の写真(宮内庁にあるか未確認)が無い場合は英国ご訪問の他の日で補う構成になる。映像ファイルの取得方法と社内教材での利用可否は荒木さん確認(要確認)。既作と題材の重なりなし(BATCH-20261124
    の P2 を長尺化)
