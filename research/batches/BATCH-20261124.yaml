    素材: 6
    シリーズ: 5
    合計: 84
  status: 未承認
  condition: 宮内庁 2026sgp の写真掲載後に着手
- id: P5
  title: '【両陛下と熊本】この秋、3つの大会のおことばで挨拶の前に述べられたこととは？被災地お見舞いの宮内庁の記録から #天皇陛下 #雅子さま #熊本'
  summary: 国スポ(10/10 青森)・国民文化祭(10/25 高知)・海づくり大会(11/15 大阪)のおことばは、いずれも「挨拶に先立ち」、令和8年熊本地震などで亡くなった方々への哀悼と被災された方々へのお見舞いから始まる(全文で一字一句)。その間の9月30日、両陛下は八代市・氷川町・宇城市をお見舞いになり、平成28年熊本地震の教訓がどのように生かされたかもご質問になった(宮内庁の報告)。締めくくり:「皆さまの心に残ったのは、どの場面ですか。」
  question: この秋の3つの大会のおことばで、陛下が挨拶の前に述べられたこととは？
  answer: 熊本地震などの災害で亡くなった方々への哀悼と、被災された方々へのお見舞い(3つのおことば全文に記載)
  type: B型(人物×過去×現在)・解説型60〜75秒
  factors: 1・2・5/解説型
  five_elements:
    強い疑問: 3つのおことばで挨拶の前に述べられたこととは？
    確認できる事実: 宮内庁 おことば ceremony2026・報告 26kumamoto1
    人物の物語: 被災地に心を寄せ続ける両陛下(報告・会見で公式に語られた範囲)
    比較: 10/10・10/25・11/15 のおことばの言い回しの違い/平成28年と令和8年の熊本地震(時間の比較)
    独自の解説: おことばが「挨拶に先立ち」で始まる構成の意味(分析と分かる言い方)
  evidence:
  - https://www.kunaicho.go.jp/watch/okotoba/imperial-family01/addresses/ceremony2026.html
  - https://www.kunaicho.go.jp/watch/activity/imperial-family-activity-01/info/26kumamoto1.html
  - https://www.kunaicho.go.jp/watch/activity/schedule01/202610/20261025-01.html
  photos: 宮内庁 26kumamoto1 5枚(熊本県提供)+高知 10枚(開会式3・声と点字の図書館2・版画トリエンナーレ2・スピリットアート3)。熊本の写真は KB-20261123-01 で一部使用済み。海づくり大会は写真なし
  competitors: 狐の夜語り「天皇陛下 高知・国民文化祭のおことばの一場面」167.6万(10/31公開・11/22 vidIQ実測)。熊本お見舞いの競合ショートの再生数は未確認。伸びる理由:おことばの一場面×陛下の所作
  risks: 災害の話題のため、被害の描写は宮内庁の報告の範囲にとどめ、あおらない。高知の開会式の「黙とう」が何に対するものかは写真説明に書かれていない(要確認・確認できなければ言わない)。素材が15枚前後で少なめ。9/19・10/18の開会宣言や10/15のおことばは形が違うため「必ず」「毎回」とは言わない
  score:
    適合: 8
    強い疑問: 16
    事実: 15
    物語: 13
    比較: 10
    解説: 8
    素材: 9
    シリーズ: 3
    合計: 82
  status: 未承認
