- id: P3
  title: '【両陛下とジブリパーク】ジブリの大倉庫で両陛下が振り返られた、21年前の愛・地球博の展示とは？宮内庁の記録から #天皇陛下 #雅子さま #ジブリパーク'
  summary: 令和8年9月20日、アジア競技大会(愛知)の際に両陛下は愛・地球博記念公園を訪ねられた。宮内庁の報告(10/26掲載)によると、愛・地球博記念館のジオラマをご覧になり、当時陛下が名誉総裁を務められた愛・地球博を懐かしく思われたご様子で、ジブリの大倉庫では、愛・地球博当時に冷凍マンモスが展示されていたことを振り返られた。ネコバスルームでは小学生とご交流。2005年と2026年をつなぐ時間の比較で、同じ日のバスケットボール観戦・前日の開会式まで。締めくくり:「皆さまは愛・地球博に行かれましたか。」
  question: ジブリの大倉庫で両陛下が振り返られた、21年前の展示とは？
  answer: 愛・地球博(2005年)当時に展示されていた冷凍マンモス(宮内庁の報告に明記)
  type: A型(行事×一場面×疑問)・一瞬型〜解説型40〜60秒
  factors: 1・2・5/解説型
  five_elements:
    強い疑問: 両陛下が振り返られた21年前の展示とは？
    確認できる事実: 宮内庁 報告 26aichi1〜3・ご日程 20260920-01
    人物の物語: 名誉総裁を務められた万博の地を、21年後にお二人で
    比較: 2005年の愛・地球博と2026年の記念公園(時間の比較)
    独自の解説: 愛・地球博の跡地が記念公園・ジブリパークになった経緯(愛知県の公式資料)
  evidence:
  - https://www.kunaicho.go.jp/watch/activity/imperial-family-activity-01/info/26aichi1.html
  - https://www.kunaicho.go.jp/watch/activity/imperial-family-activity-01/info/26aichi3.html
  - https://www.kunaicho.go.jp/watch/activity/schedule01/202609/20260920-01.html
  photos: 宮内庁 26aichi2・3 計16枚+ご日程 20260919-01(3)・20260920-01(4)・20260920-02(1)(重複を除くと12〜16枚の見込み)。宮内庁Instagram(9/28)は利用条件を要確認
  competitors: 世界のかわら版3「アジア大会のバスケで両陛下と王族の再会」61.5万(11/11公開・11/22 vidIQ実測)=同じ9/20の行程。ジブリパークの競合ショートの再生数は未確認。伸びる理由:誰もが知る固有名詞(ジブリ)×両陛下の一場面
  risks: 冷凍マンモスが展示されていた建物とジブリの大倉庫が同じかは報告の文面だけでは断定できない(言い方は報告どおりにする・要確認)。2か月前の出来事(報告掲載は10/26)。ジブリ作品の展示物が写る写真の扱いは要確認(内部教材)。王族との再会は宮内庁の記録にないため扱わない
  score:
    適合: 8
    強い疑問: 18
    事実: 14
    物語: 12
    比較: 9
    解説: 9
    素材: 11
    シリーズ: 3
    合計: 84
  status: 未承認
- id: P4
  title: '【愛子さまとシンガポール】56年前に祖父母の上皇上皇后両陛下が植えられた木とは？3代をつなぐ日本庭園 宮内庁のおことばから #愛子さま #皇室 #シンガポール'
  summary: 11/18の午餐会のおことばで、愛子さまは、1970年に祖父母の上皇上皇后両陛下がジュロン地区にソテツを植樹され、今では日本庭園となったその地を訪れること、また両陛下のご成婚の折に両親の名を冠した蘭が贈られたシンガポール植物園を訪れることに触れられた(全文で一字一句)。1970年→ご成婚の蘭→2026年の愛子さまと、3代の歩みを時系列で。締めくくり:「皆さまの心に残ったのは、3代のうちどの場面ですか。」
  question: 56年前、祖父母の上皇上皇后両陛下がシンガポールに植えられた木とは？
  answer: ソテツ(1970年、ジュロン地区。今は日本庭園)。おことば全文に記載
  type: B型(人物×過去×現在)・解説型60〜75秒
  factors: 1・2・3・5/解説型
  five_elements:
    強い疑問: 祖父母が56年前に植えられた木とは？
    確認できる事実: 宮内庁 おことば全文(2026sgp)・ご日程(掲載後)
    人物の物語: 祖父母・両親から受け継がれたシンガポールとの交流
    比較: 1970年の植樹と2026年の訪問(時間の比較)
    独自の解説: シンガポールで要人の名を冠した蘭が贈られる慣習(シンガポール政府の公式情報で確認できる範囲)
  evidence:
  - https://www.kunaicho.go.jp/watch/okotoba/imperial-family01/addresses/2026sgp.html
  - https://www.kunaicho.go.jp/watch/activity/schedule01/2026sgp/
  photos: 宮内庁 2026sgp は11/24時点で写真0枚(掲載待ち)。1970年・平成18年(2006年)の宮内庁写真の有無は要確認
  competitors: 日テレNEWS 羽田ご出発(ラン命名・植樹の予定を列挙)33.3万/t2bkk ホテルで花束(蘭)22.7万(85倍)/みんなの皇室広場「なぜ選ばれたのか」65.9万(18倍)(いずれも11/22 vidIQ。outliers値を含む)。伸びる理由:花(蘭)と家族のつながりへの関心。ソテツを扱う競合は未確認
  risks: 宮内庁の写真が掲載されるまで着手できない(写真が15枚に届かなければ不採用)。実際に日本庭園を訪ねられたこと・植樹・蘭の命名式(愛子さまの名の蘭)は報道のみで、宮内庁のご日程掲載で確認する。上皇ご夫妻の2006年の再訪は報道のみ(要確認)。1970年当時のご身位(皇太子同妃両殿下)の言い方はG1で確認
  score:
