status: 保留(荒木指示 2026-11-24: 11/27のプラン変更後に改めて調査し直してから決める。この案は参考として残す)
basis: 'R1(11/24確認): 宮内庁 新着の最新は11/20のまま。ご日程 schedule01 202611 は11/18まで。2026sgp(シンガポール)の写真ページは0件、海づくり大会(11/14〜15)も写真なし。使える公式記録: 愛子さまシンガポール午餐会おことば(11/18)・ラオスご訪問(令和7年)写真21ページ58枚とおことば・英国ご訪問(令和6年)写真19ページ35枚・アジア競技大会(愛知)報告26aichi1〜3(10/26掲載)・熊本お見舞い報告26kumamoto1(11/13掲載)・おことば ceremony2026。R2: vidIQ残高0(12/21回復)のため新しい実測なし。数値は11/22〜23のvidIQ実測(research/KB-20261122-02/competitors.md・docs/research/2026-11-23_*.md)を再掲。WebSearchでは該当題材の競合ショートの再生数は取得できず「未確認」。既作(KB-20261121-01〜KB-20261123-06)・BATCH-20261123と題材を重ねない。'
items:
- id: P1
  title: '【愛子さま 2つの国のおことば】ラオスとシンガポールで、どちらにも込められた感謝とは？宮内庁の記録から #愛子さま #皇室 #シンガポール'
  summary: 愛子さまの外国公式訪問1回目(令和7年11月 ラオス)と2回目(令和8年11月 シンガポール)の晩餐会・午餐会のおことばを並べる。どちらも現地の言葉のあいさつで始まり(ラオス語/マレー語・華語・タミル語・英語)、東日本大震災の際に寄せられた支援への感謝と、先人の努力への思いが述べられている。おことば全文から一字一句で引用し、ラオスの写真(58枚)と、シンガポールの写真(掲載され次第)で1年の歩みをたどる。締めくくり:「皆さまの心に残ったのは、どちらの国でのお言葉ですか。」
  question: ラオスとシンガポール、2つの国のおことばのどちらにも込められた感謝とは？
  answer: 東日本大震災などの際に両国から寄せられた支援への感謝(両方のおことば全文に記載)。どちらも現地の言葉のあいさつで始まる
  type: B型(人物×過去×現在。同じ方の1回目と2回目の比較)・解説型60〜75秒
  factors: 1・2・3・5/解説型
  five_elements:
    強い疑問: 2つの国のおことばに共通する感謝とは？
    確認できる事実: 宮内庁 おことば全文(lao2025・2026sgp)
    人物の物語: 初めての外国公式訪問から1年、2回目の訪問へ
    比較: ラオス(1回目)と シンガポール(2回目)のおことば・行程(事実×事実)
    独自の解説: 晩餐会・午餐会でのおことばの役割、現地語のあいさつの意味(分析と分かる言い方)
  evidence:
  - https://www.kunaicho.go.jp/watch/okotoba/imperial-family01/addresses/lao2025.html
  - https://www.kunaicho.go.jp/watch/okotoba/imperial-family01/addresses/2026sgp.html
  - https://www.kunaicho.go.jp/watch/activity/schedule01/2025lao/
  photos: 宮内庁 2025lao 21ページ58枚(晩餐会5・タートルアン大塔5・ラオ・シルク5ほか)。シンガポールは11/24時点0枚(掲載待ち)
  competitors: 皇室日記「4つの言語であいさつ・午餐会のおことば」14.1万(11/18公開・vidIQ outliers値)/t2bkk 午餐会スピーチ 11万(14倍)/数字型「4か国語であいさつ」27.4万(9.8倍)。伸びる理由:語学×外国の場×具体的な数。ラオスの晩餐会を扱う競合の再生数は未確認
  risks: シンガポールの宮内庁写真が未掲載(ラオスの写真が中心になる。シンガポール分は掲載後に追加)。英語・現地語の肉声は宮内庁未掲載のため使わない。ラオスのおことばの「小学生でした」の一文はG1で全文確認。2国の比較は同じ方の歩みの比較に限り、国同士の優劣は言わない
  score:
    適合: 9
    強い疑問: 17
    事実: 15
    物語: 14
    比較: 10
    解説: 8
    素材: 13
    シリーズ: 5
    合計: 91
  status: 未承認
- id: P2
  title: '【雅子さまとオックスフォード】陛下と同じ大学から、雅子さまに贈られたものとは？英国ご訪問の宮内庁の記録から #雅子さま #天皇陛下 #皇室'
  summary: 令和6年6月28日、英国ご訪問の最終日に両陛下はオックスフォードを訪ねられ、雅子さまに名誉学位が授与された(宮内庁写真「皇后陛下の名誉学位授与式にご臨席になる天皇皇后両陛下」)。陛下は令和7年のお誕生日会見で、以前に陛下ご自身も受けた名誉法学博士号が雅子さまにも授与されたことに触れられている(会見全文で一字一句)。ベイリオル・コレッジ、桜の植樹、陛下が留学中に過ごされた部屋から手を振られる写真まで、英国ご訪問35枚でたどる。締めくくり:「皆さまの心に残ったのは、オックスフォードのどの場面ですか。」
  question: 陛下と同じオックスフォード大学から、雅子さまに贈られたものとは？
  answer: 名誉法学博士号(令和6年6月28日 授与式。陛下も以前に同じ博士号を受けられている)
  type: A型(行事×一場面×疑問)+B型の背景・解説型50〜70秒
  factors: 1・2・3・5/解説型
  five_elements:
    強い疑問: 同じ大学から雅子さまに贈られたものとは？
    確認できる事実: 宮内庁 2024gbr/443 の写真説明・令和7年 天皇陛下お誕生日会見全文
    人物の物語: お二人それぞれの留学の地を、そろって訪ねられた日
    比較: 陛下が名誉博士号を受けられた年と、雅子さまの令和6年(時間の比較)
    独自の解説: 名誉学位の意味と授与式の流れ(大学の公式情報で確認できる範囲)
  evidence:
  - https://www.kunaicho.go.jp/watch/activity/schedule01/2024gbr/443.html
  - https://www.kunaicho.go.jp/watch/okotoba/imperial-family01/press-conference/emperor2025.html
  - https://www.kunaicho.go.jp/watch/okotoba/imperial-family01/addresses/gbr2024.html
  photos: 宮内庁 2024gbr 19ページ35枚(オックスフォード4枚=ベイリオル・コレッジ/名誉学位授与式/桜の植樹/留学中のお部屋から。歓迎式典4・晩餐会2・キュー植物園3ほか)
  competitors: 同じ題材の競合ショートは検索で見つからず再生数は未確認(競合が少ない=需要ありとは扱わない)。近い型:皇室秘話室【外務省最後の日】寄せ書きの一文字 27万(雅子さまの経歴×一場面)/皇室ヴェール 英語・外国要人の一場面 100万超が多い。伸びる理由:雅子さまの国際経験と海外からの敬意
  risks: 陛下が名誉博士号を受けられた年(平成3年と報道)と、雅子さまが学ばれたコレッジ(ベイリオル)はG1で宮内庁の略歴・大学の公式発表で確認。2年前の出来事で時事性は低い(12/9 皇后さまお誕生日の前に向く)。会見全文URL(emperor2025)は要確認
  score:
