items:
- id: SG01
  title: '【愛子さま】シンガポール大統領の午餐会 おことばの最初に4つの言葉で伝えられたあいさつとは？ 宮内庁の全文から #愛子さま #シンガポール #皇室'
  summary: '疑問: 午餐会の最初の4つの言葉とは？ 答え: マレー語「Selamat Tengah hari」、華語「大家好」、タミル語「வணக்கம்」、英語「Good
    Afternoon」(いずれも「こんにちは」)。結びは「To your health.(乾杯)」'
  type: A型・ショート30〜50秒(1本=1場面=1つの疑問)
  materials: 宮内庁のシンガポールの写真は未掲載。場所の写真は Wikimedia Commons(作者・ライセンス表記)、人物は宮内庁の既存の愛子さまの写真に実際の撮影日を表示、おことば・ご感想の原文を大きな文字画面で。報道写真・映像は使わない
  status: 承認済
