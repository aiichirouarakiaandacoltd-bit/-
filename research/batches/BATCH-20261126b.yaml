    人物の物語: ブラジル(令和7年6月)→神戸(12月)→歌会始(令和8年1月)→浜松(3月)と、子どもたちとの出会いをつないでこられた歩み
    比較: 時間の比較(ブラジルで会った子どもたち/日本で暮らすブラジル・ペルーにルーツを持つ子どもたち)。皇族方は比べない
    独自の解説: 日本で暮らすブラジルにルーツを持つ人々と浜松(在留外国人の統計は法務省・浜松市の公表値だけ。確認できなければ入れない)
