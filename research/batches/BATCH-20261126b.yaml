  title: '【秋篠宮ご夫妻】和歌山の全国育樹祭で手入れされた2本の木 15年前に植えられたのはどなた？ 宮内庁の記録から #秋篠宮さま #紀子さま #全国育樹祭'
  question: 秋篠宮ご夫妻が和歌山で手入れされた2本の木は、15年前にどなたが植えられたものか？
  answer: '平成23(2011)年の第62回全国植樹祭で、当時の天皇皇后両陛下(現在の上皇上皇后両陛下)がお手植えになったウバメガシとイチイガシ(秋篠宮さまの 11/8 のおことば)。殿下はウバメガシの整理伐、妃殿下はイチイガシへの施肥をなさった(宮内庁の写真説明)。和歌山県の記録では、ウバメガシは天皇陛下(現在の上皇陛下)、イチイガシは皇后陛下(現在の上皇后陛下)のお手植え=殿下は父君の植えられた木を手入れされた'
  summary: '冒頭: 11/7 新庄総合公園でウバメガシに向かわれる殿下の写真+疑問「この2本の木を15年前に植えられたのは、どなたでしょうか」。事実(2〜4場面): お手植えについての説明を受けられる→御製の碑をご覧に→殿下 ウバメガシの整理伐/妃殿下 イチイガシへの施肥→介添えの高校生へお声がけ(すべて宮内庁の写真説明どおり)。前置き+答え: 「15年前にこの木を植えられたのは、どなただったのでしょうか。答えは、当時の天皇皇后両陛下、いまの上皇ご夫妻です。」→おことばの一文「15年の歳月を経て、健やかに成長していることを大変うれしく思いました。」(一字一句)。意味づけ(分析と分かる言い方): 植える行事と育てる行事で、世代をこえて同じ木が受け継がれているのかもしれません。問いかけ: 「皆さまの町にも、記念に植えられた木はありますか。」'
  five_elements:
    強い疑問: 15年前にこの2本の木を植えられたのは、どなたか？
    確認できる事実: 宮内庁 秋篠宮家のご日程 11/7(写真6枚と説明)・11/8 おことば全文
    人物の物語: 上皇ご夫妻が植えられた木を、15年後に秋篠宮ご夫妻が手入れされた(おことばの「大変うれしく思いました」)
    比較: '時間の比較: 2011年(全国植樹祭・お手植え)と2026年(全国育樹祭・お手入れ)。制度の比較: 植樹祭と育樹祭(育樹祭は1977年から、植樹祭を開いた都道府県で開かれる=おことば)。皇族方の優劣は言わない'
    独自の解説: '「植える」植樹祭と「育てる」育樹祭のつながり、整理伐と施肥の意味(林野庁・和歌山県の説明に沿って、分析と分かる言い方で)'
