  answer: '令和7年12月の皇后陛下お誕生日祝賀。続いて上皇陛下お誕生日祝賀・新年祝賀の儀・新年一般参賀・講書始・歌会始(初めて詠進)・天皇誕生日祝賀の儀、5月に国賓フィリピン大統領の宮中晩餐に初めてご陪席(宮内庁皇嗣職の文書)'
