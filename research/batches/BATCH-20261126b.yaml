  - https://www.pref.wakayama.lg.jp/prefg/070700/d00208231.html
  photos: '宮内庁 11/7〜8 の6ページで 18枚(すべて 1000px・提供者表記なし・直近未使用)。説明つき: お手植えの説明・御製の碑・ウバメガシの整理伐・イチイガシへの施肥・高校生へのお声がけ・式典・炭琴。補助に秋篠宮ご夫妻の令和8年の写真 205枚。2011年の植樹祭当日の写真は未確認(宮内庁の旧ページ・Commons を G2 で確認。なければ「当時の写真」は使わず、木と碑の写真で語る)。表紙: ウバメガシの前のご夫妻(皇族方以外が入らない切り抜きを G2 で確認)'
