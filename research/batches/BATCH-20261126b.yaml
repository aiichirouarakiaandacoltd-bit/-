  question: 歌に子どもたちへの願いを詠まれた年の3月、佳子さまが浜松で訪ねられた2つの学校とは？
  answer: 'ブラジルにルーツを持つ子どもが学ぶ「エスコーラ・アレグリア・デ・サベール・浜松」と、ブラジル・ペルーにルーツを持つ子どもが学ぶ「ムンド・デ・アレグリア」(宮内庁のご日程の題名どおり)'
  summary: '冒頭: 浜松の学校での佳子さまの写真+疑問。過去: 令和7年6月 ブラジルご訪問(外交関係樹立130周年)で各地の子どもたちと、12月に神戸の「関西ブラジル人コミュニティCBK」の子どもたちと(宮内庁 歌会始の解説)。歌会始の歌(一字一句)。現在: 令和8年3月24日 浜松の2校とCOLORS(外国にルーツを持つ若者の団体)とのご懇談。ペルーの伝統舞踊「マネリラ」・和太鼓をご覧(写真説明)。意味づけ: ブラジルでの出会いが、日本で暮らす子どもたちへと続いているのかもしれません。問いかけ: 「佳子さまのご活動で、心に残っているものはどれですか。」'
  five_elements:
