# =====================================================================
# 企画入力ファイル
# ---------------------------------------------------------------------
# 使い方：
#   1. このファイルを projects/<project_slug>/input/project_input.yaml へコピーする
#   2. 分かる範囲だけ記入する（未入力項目を無理に埋めないこと）
#   3. python run_imperial_pipeline.py projects/<slug>/input/project_input.yaml --stage draft
#
# 情報が不足していても処理は止まらない。
# 制作不能となる重大な不足は、承認用サマリーへ自動的に集約される。
# =====================================================================

project_name:            # 例: 愛子さま 初めての single 公務
project_slug:            # 半角英数字とアンダースコアのみ。フォルダ名になる。
channel: 日本が誇る皇室物語
main_person:             # 例: 愛子さま
theme:                   # 何を伝える動画か。1〜2文で書く。
working_title:           # 仮タイトル。未定なら空欄でよい。
target_length_min: 12
target_length_max: 14
shorts_count: 1
reference_urls: []       # 参考URL。公式サイトを優先する。
reference_files: []      # 手元資料のパス。
must_include: []         # 必ず触れる事実・論点
must_not_include: []     # 触れない事項
publication_target_date: # YYYY-MM-DD
editor_name:             # 動画編集者名
sample_mode: false       # true にすると全生成物へサンプル表示が入る
notes:                   # その他の指示
