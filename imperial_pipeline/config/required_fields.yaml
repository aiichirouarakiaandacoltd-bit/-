  "research/06_素材権利台帳.csv":
    columns: [素材ID, 対象場面, 人物, 素材内容, 掲載ページURL, 画像・動画の直接URL, 権利者, 利用条件, YouTube利用可否, クレジット条件, 加工可否, 確認状態, 代替案, 注意事項]

  "production/12_長尺素材設計.csv":
    columns: [時間, 章, ナレーション要約, 素材ID, 素材種別, 必要素材, 人物, 候補URL, 権利確認状態, 画面内テロップ, 演出, 代替素材, 禁止事項]
    max_rows: 120

  "production/13_Shorts素材設計.csv":
    columns: [秒数, ナレーション, メイン素材, 補助素材, テロップ, 画面構成, ズーム・移動, 権利状態, 注意事項]
    max_rows: 20

  "library/approved_materials.csv":
    columns: [素材ID, 素材名, 種別, 権利者, 取得元URL, 利用条件, YouTube利用可否, クレジット条件, 加工可否, 有効期限, 登録日, 確認者, 備考]

# 入力ファイルの必須項目
input:
  "input/project_input.yaml":
    required: [project_name, project_slug, channel, theme]
    recommended: [main_person, working_title, target_length_min, target_length_max, shorts_count, publication_target_date, editor_name]
  "input/approval.yaml":
    required: [approval_status]
    recommended: [selected_title, selected_thumbnail]

# 事実台帳の 確認状態 に許される値
enum:
  確認状態:
    - 確認済み
    - 複数資料で確認済み
    - 一次資料未確認
    - 要追加確認
    - 使用不可
  分類:
    - A．確認済み事実
    - B．根拠付き解説
    - C．演出・一般イメージ
    - D．使用不可
  YouTube利用可否:
    - 使用可
    - 条件付き使用可
    - 使用非推奨
    - 使用禁止
    - 要確認
  素材種別:
    - 公式写真
    - 公式動画
    - 報道素材候補
    - 公的資料
    - 図解
    - 地図
    - 建物・会場
    - 一般イメージ
    - テロップ中心
    - 素材不足

# 台本で断定してよい確認状態（これ以外は断定表現を禁止する）
assertable_states:
  - 確認済み
  - 複数資料で確認済み

# 最終パッケージ生成をブロックする条件
final_blockers:
  - 台本が参照する事実IDの確認状態が「使用不可」である
  - 出典一覧に架空URL（example.com 等）が含まれる（sample_mode では警告に緩和）
  - 素材権利台帳に皇族方のAI生成顔・顔加工素材が含まれる
  - 最終監査結果の判定が「不合格」である
