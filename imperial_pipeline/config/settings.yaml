# =====================================================================
# 日本が誇る皇室物語 / 制作支援システム 基本設定
# ---------------------------------------------------------------------
# このファイルは荒木愛一朗が編集する。数値を変更すると、テンプレートの
# 目標文字数・行数上限・チェック基準へ自動的に反映される。
# =====================================================================

channel_name: 日本が誇る皇室物語

# ---------------------------------------------------------------------
# 【重要・要更新】chars_per_minute は暫定値である。
# 300 という値は実測に基づかない仮置きであり、
# VOICEVOX「青山龍星」／話速 0.88 で実際に読み上げ、
#   （読み上げた文字数）÷（実測した分数）
# を計測したうえで、必ずこの値を更新すること。
# 更新しない限り、台本の目標文字数（12〜14分＝3,600〜4,200字）は
# あくまで目安であり、尺が想定より長短する可能性がある。
# ---------------------------------------------------------------------
chars_per_minute: 300   # 暫定値。VOICEVOX青山龍星・話速0.88で実測後に必ず更新すること

voice_name: 青山龍星
voice_speed: 0.88
voice_speed_min: 0.85
voice_speed_max: 0.90

long_min_minutes: 12
long_max_minutes: 14
long_allowed_min_minutes: 9    # テーマにより許容される下限
long_allowed_max_minutes: 16   # テーマにより許容される上限

shorts_count_default: 1
shorts_min_seconds: 50
shorts_max_seconds: 60

cut_seconds_min: 3
cut_seconds_max: 5

long_visual_rows_max: 120
shorts_visual_rows_max: 20

thumbnail_text_min: 4
thumbnail_text_max: 14

bgm_file: UNL1337.wav
# 箕輪レコーズのクレジット表記。編集者が概要欄へそのまま貼れる完成形の文字列にすること。
bgm_credit: "【要確認・正式表記を荒木が入力】"

# 問い合わせ先。未入力の間は架空アドレスを生成せず、この表記のまま出力する。
contact: "【お問い合わせ先：要入力】"

encoding: utf-8
csv_encoding: utf-8-sig
newline: "\n"

# 企画評価の配点（工程6）と判定閾値
scoring:
  視聴者適合性: 20
  公式根拠の強さ: 15
  新規性: 10
  クリック可能性: 10
  視聴継続可能性: 10
  長尺化適性: 10
  Shorts化適性: 5
  素材確保可能性: 10
  権利安全性: 5
  収益化・炎上安全性: 5
scoring_thresholds:
  優先採用: 85
  採用: 75
  修正後採用: 65
  # 64点以下は「原則見送り」

# 最終パッケージから機械的に除去する内部情報の見出しキーワード。
# 併せて <!-- INTERNAL:START --> 〜 <!-- INTERNAL:END --> で囲まれた範囲も除去する。
internal_headings:
  - 内部採点
  - 企画評価
  - 制作見送り基準
  - 荒木内部判断
  - 未採用タイトル
  - 未採用サムネイル
  - 内部リスク評価
  - 推論過程
  - 内部メモ

# 最終パッケージに混入してはならない語（検出したら警告する）
final_package_forbidden_words:
  - 制作費
  - 報酬
  - 単価
  - 見積
  - 契約条件
  - 支払
