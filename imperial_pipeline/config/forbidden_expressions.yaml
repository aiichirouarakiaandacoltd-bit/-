# =====================================================================
# 禁止表現リスト
# ---------------------------------------------------------------------
# Python（modules/forbidden_checker.py）は「検出」のみを行う。
# 最終判定は imperial-safety-reviewer サブエージェントと荒木愛一朗が行う。
#
# 検出結果は次の4分類で報告する。
#   使用可能            … 文脈上問題なし（引用内など）
#   留保表現に変更      … 断定を避けた表現へ書き換える
#   根拠追加が必要      … 出典・事実IDを付せば使用できる
#   使用禁止            … 削除する
# =====================================================================

# 原則使用禁止。検出時の既定分類は「使用禁止」。
high_risk:
  - 胸の内では
  - 本当は
  - 違いありません
  - 間違いなく
  - 決意された
  - 覚悟された
  - 隠された真実
  - 知られざる闇
  - 完全決裂
  - 激怒
  - 異例すぎる
  - 衝撃

# 文脈確認が必要。機械的に削除しない。既定分類は「根拠追加が必要」。
context_check:
  - きっと
  - 心を痛めて
  - 深くお考えに
  - 孤独
  - 冷遇
  - 確執
  - 不仲
  - 嫉妬
  - 対立
  - 怒り
  - 涙をこらえ

# 検出対象外とする条件（公式発言・公的文書の引用内）
exceptions:
  - 引用ブロック内      # 行頭が ">" の行
  - 【引用】表記のある段落
  - 禁止事項を列挙している範囲（SCAN:OFF 〜 SCAN:ON）

# 例外判定に使う具体パターン（forbidden_checker.py が参照する）
exception_patterns:
  line_prefixes:
    - ">"
  paragraph_markers:
    - "【引用】"
    - "【公式発表引用】"
  fenced_blocks:
    - "```引用"
  # 禁止事項リストそのものを検出しないための領域指定。
  # 制作指示書やチェックリストの「禁止事項」節を囲んで使用する。
  # 台本・調査結果など、本文を書く場所では使用しないこと。
  scan_off: "<!-- SCAN:OFF -->"
  scan_on: "<!-- SCAN:ON -->"

# 追加検出：第3章の絶対禁止事項に直結する語。既定分類は「使用禁止」。
critical:
  - ディープフェイク
  - AI生成した顔
  - 顔を合成
  - 顔の合成
  - 若返らせ
  - 老化させ
  - 架空のURL
  - 捏造

# 煽りタイトル検出（工程7で使用）。既定分類は「留保表現に変更」。
clickbait:
  - 衝撃の真実
  - ついに激白
  - 涙が止まらない
  - 絶望
  - 崩壊
  - 大炎上
  - ○○の末路
  - 悲劇
  - 危機的

# 内心断定の文型（正規表現）。既定分類は「留保表現に変更」。
inner_state_patterns:
  - "と(思われた|感じられた|考えられた)(はずだ|に違いない)"
  - "内心(では)?"
  - "本心(では)?"
  - "心の中(では)?"
  - "であろう"
  - "に違いない"

# 分類の既定値
default_classification:
  critical: 使用禁止
  high_risk: 使用禁止
  context_check: 根拠追加が必要
  clickbait: 留保表現に変更
  inner_state_patterns: 留保表現に変更
