# =====================================================================
# 皇族方の呼称・敬称 統一表（初期版）
# ---------------------------------------------------------------------
# use          : 本システムの台本・テロップ・投稿文で使用する表記
# variants     : 表記ゆれ候補（検出対象。使用時は use へ統一する）
# status       : 確定 / 要確認   ← 要確認は荒木愛一朗の確認が必要
# note         : 補足
#
# 【荒木愛一朗が確認すべき事項】
#  1. use の表記が、チャンネルの過去動画の表記と一致しているか
#  2. 「さま」「様」のどちらを標準とするか（本表では「さま」を標準とする）
#  3. 公式文書引用時は原典の表記を優先し、統一の対象外とすること
#  4. status: 要確認 の項目は、宮内庁公式サイトの表記を確認のうえ確定させること
# =====================================================================

standard:
  # 「さま」表記を標準とする。公式文書の引用内はこの限りではない。
  suffix_default: さま
  quote_exempt: true   # 引用内は表記統一の対象外

persons:
  - key: 天皇
    use: 天皇陛下
    variants: [今上天皇, 天皇さま, 天皇様, 徳仁天皇, 天皇陛下さま]
    status: 確定
    note: 単独で述べるときは「天皇陛下」。両陛下を併記するときは「天皇皇后両陛下」。

  - key: 皇后
    use: 皇后陛下
    variants: [雅子さま, 雅子様, 皇后さま, 皇后様, 雅子皇后]
    status: 要確認
    note: >-
      文脈上お名前を示す必要がある場合に限り「皇后陛下（雅子さま）」の形を許容するか、
      常に「皇后陛下」で統一するかを荒木愛一朗が決定すること。

  - key: 両陛下
    use: 天皇皇后両陛下
    variants: [両陛下, 天皇・皇后両陛下]
    status: 確定
    note: 初出は「天皇皇后両陛下」。同一章内の再出は「両陛下」を許容する。

  - key: 上皇
    use: 上皇陛下
    variants: [平成の天皇, 前天皇, 明仁上皇, 上皇さま, 上皇様]
    status: 確定
    note: 在位当時の出来事を述べる場合は「当時の天皇陛下」等、時点を明示する。

  - key: 上皇后
    use: 上皇后陛下
    variants: [美智子さま, 美智子様, 上皇后さま, 上皇后様]
    status: 要確認
    note: 皇后陛下と同様、お名前併記の可否を荒木愛一朗が決定すること。

  - key: 皇嗣
    use: 秋篠宮皇嗣殿下
    variants: [秋篠宮さま, 秋篠宮様, 秋篠宮文仁親王, 皇嗣殿下, 秋篠宮皇嗣殿下さま]
    status: 確定
    note: 初出は「秋篠宮皇嗣殿下」。再出は「皇嗣殿下」を許容する。

  - key: 皇嗣妃
    use: 秋篠宮皇嗣妃紀子殿下
    variants: [紀子さま, 紀子様, 紀子妃殿下, 皇嗣妃殿下]
    status: 要確認
    note: >-
      正式表記は長いため、初出のみ正式表記、再出は「紀子さま」とする運用が
      考えられる。荒木愛一朗が方針を確定させること。

  - key: 愛子内親王
    use: 愛子さま
    variants: [愛子内親王殿下, 愛子様, 愛子さん, 敬宮愛子内親王, 敬宮さま]
    status: 要確認
    note: >-
      公的行事の記述では「敬宮愛子内親王殿下」が正式。動画本文では
      「愛子さま」を標準とし、初出または公式行事の記述で正式表記を用いるか、
      荒木愛一朗が方針を確定させること。

  - key: 佳子内親王
    use: 佳子さま
    variants: [佳子内親王殿下, 佳子様, 佳子さん]
    status: 要確認
    note: 愛子さまと同じ方針を適用すること。

  - key: 悠仁親王
    use: 悠仁さま
    variants: [悠仁親王殿下, 悠仁様, 悠仁さん]
    status: 要確認
    note: 愛子さまと同じ方針を適用すること。

  - key: 皇太子
    use: 皇太子
    variants: [皇太子殿下, 皇太子さま]
    status: 要確認
    note: >-
      【重要】現在、皇太子は不在であり、皇位継承順位第一位は秋篠宮皇嗣殿下である。
      過去の出来事を述べる場合に限り「当時の皇太子殿下」等、時点を明示して用いる。
      現在形で「皇太子」と記述してはならない。

# ---------------------------------------------------------------------
# 敬語・所作に関する表記ルール（台本・テロップ共通）
# ---------------------------------------------------------------------
verbs:
  - use: ご訪問になりました
    avoid: [訪問しました, 行きました, 訪れました]
    status: 確定
  - use: お言葉を述べられました
    avoid: [発言しました, スピーチしました, 語りました]
    status: 確定
    note: お言葉の内容を要約する場合も、創作した発言を「　」で囲ってはならない。
  - use: ご出席になりました
    avoid: [出席しました, 参加しました]
    status: 確定
  - use: ご覧になりました
    avoid: [見ました, 視察しました]
    status: 要確認
    note: 公式発表が「視察された」であればその表記を優先する。

# ---------------------------------------------------------------------
# 禁止表記（敬意を欠く／事実を歪める）
# ---------------------------------------------------------------------
forbidden_forms:
  - form: 呼び捨て（例：雅子、愛子）
    reason: 敬称を欠く。
  - form: 「さん」付け（例：愛子さん）
    reason: チャンネルの基本姿勢と一致しない。
  - form: 二重敬語（例：おっしゃられました）
    reason: 誤用。「おっしゃいました」とする。
  - form: 敬称の混在（同一動画内での「さま」「様」混用）
    reason: 表記ゆれ。use へ統一する。
