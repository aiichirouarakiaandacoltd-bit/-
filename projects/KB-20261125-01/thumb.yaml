note: 2026-11-25 デザイナー(G6②)。写真は ledger の確認方法が「キャプション」または「目視確認済(当てっこ係)」のものだけ(A021・A025=ページ説明文＋目視確認済(当てっこ係)、A057・A061・A073=キャプション)。3パターンで同じ写真は使っていない。切り抜き・拡大縮小のみ。かぎかっこは宮内庁の原文の一部を一字一句(「あの幼かった愛子が」=令和3年 皇后陛下お誕生日のご感想、「生まれてきてありがとう」=平成14年4月2日 御誕生につき記者会見)で、帯の右に出典を小さく添えた。文字は各題名の言葉から取った(A=題名Aそのまま。B・Cは publish.yaml の事実確認済みの表紙文言を2か所に詰めたもの)。check_faces(お顔の頭の範囲と文字・画面端)と credit(クレジットと文字の重なり)は3枚とも通過し、画像を開いて目でも確認した。赤の装飾・絵文字・作り台詞・矢印・吹き出しなし(Aの右の愛子さまのお召し物の色は写真そのもの)。Cの右 A061 は縦長の写真のため、お顔を約215px・y約333 にしてパネルの左右にぼかしの余白が出ないようにした。Cの左は A021(令和6年 皇后陛下お誕生日のご近影・長辺1000px・等倍)。お顔は x350(型Dの x320 だとパネル右端にぼかしの余白が出るため)。パネル上端(帯の下 約25px)は同じ写真のぼかしで埋めている。Bは天皇陛下のお顔もお召し物もどちらのパネルにも入らない切り抜き(お顔の位置を境目寄りの 左x457・右x849 に置いた。大きさ約175px・高さ y305 は型Dのまま)。2026-11-25 直し係(rules_check.md 12. G6 の指摘で修正)= Bの帯右を説明の文から出典「令和元年〜令和7年のご感想より」に替え、文字を2か所・16字に/Bの切り抜きを陛下のお召し物が出ない形に/Cの左を A065(長辺338px)から A021(長辺1000px)に差し替え(言葉は平成14年・写真は令和6年。帯の出典とクレジットで年を分けて示す)/3枚ともクレジットの右余白を約25pxに(pipeline/thumb_long.py の credit に right を追加。既定は元の8px)。作り直し後も check_faces・credit は3枚とも通過、画像を開いて目で確認した。2026-11-25 直し係(荒木指示「サムネイル3枚の構図が全部一緒。素材画像、構図、配置、タイトルの位置などを変えてABテストが出来るように」)= 3枚の構図を作り分けた(これより前の note の「A・B・C とも型D」「Bは A073」「Cの右 A061」は古い記述)。A は型Dのまま(A025・A057)。B は型R系に替え、写真を A073 から A059(令和7年 愛子内親王殿下お誕生日のご近影の別カット・長辺1000px・キャプション照合・左向き)に。お顔は横顔で検出器が拾わないため手で指定(元の写真で中心 x385・y425・高さ約150px → 表紙で約205px・x905・y300)。左下の小さな写真は A037(令和元年12月のご近影)・A043(令和3年12月のご近影)・A142(令和4年3月17日 ご成年の記者会見)・A152(令和6年3月20日 学習院大学卒業式)で、どれも年が掲載ページで確認できる(台帳の確認方法 キャプション／ページ説明文＋目視確認済(当てっこ係))。小さな表示(124×140px・お顔約56px)のため長辺400pxのまま使った。C は A021 の1枚だけにし(A061 は外した)、右に縦書き。右側の写真のない所は同じ写真のぼかしに横方向の濃紺を重ねた(下部のグラデーションではない)。かぎかっこは縦書き用の字形。3枚で同じ写真は使っていない(A=A025・A057/B=A059・A037・A043・A142・A152/C=A021)。check_faces(B は小さな写真4枚のお顔も含む)と credit は3枚とも通過。3枚と一覧 abc_overview.jpg を開いて目で確認した。2026-11-25 直し係(荒木の指摘で表紙3枚の文字を直した。構図・写真は変えていない)= A=下の一言を「7回のご感想のうち/6回」から「母がつづった＋金『娘への思い』」に替え、帯の右の出典の上に小さく「雅子さま」/B=左上に主語の表示「愛子さま」(台詞ではない・かぎかっこなし)を足した/C=縦書きの引用の上に小さく「雅子さま」、出典を「平成14年 愛子さまご誕生の会見より」に(濃紺の札の上)。かぎかっこ内は原文の一部のまま(呼びかけは足していない)。check_faces・credit は3枚とも通過、3枚と一覧を開いて目で確認した。2026-11-25 直し係(rules_check.md 15. の小さな直し。構図・写真は変えていない)= A=下の一言を「母がつづられた＋金『娘への思い』」に(敬語を本編にそろえた)/B=「7回のご感想」の下に小さな出典「雅子さまのお誕生日のご感想より」を足した/C=出典を「愛子さまご誕生の会見より(平成14年4月)」に替え、縦書きのかぎかっこ(縦書き用の字形)を文字から離して置き直した。check_faces・credit は3枚とも通過、3枚と一覧を開いて目で確認した
