note: 2026-11-25 デザイナー(G6②)。写真は ledger の確認方法が「キャプション」または「目視確認済(当てっこ係)」のものだけ(A025=ページ説明文＋目視確認済(当てっこ係)、A057・A061・A065・A073=キャプション)。3パターンで同じ写真は使っていない。切り抜き・拡大縮小のみ。かぎかっこは宮内庁の原文の一部を一字一句(「あの幼かった愛子が」=令和3年 皇后陛下お誕生日のご感想、「生まれてきてありがとう」=平成14年4月2日 御誕生につき記者会見)で、帯の右に出典を小さく添えた。文字は各題名の言葉から取った(A=題名Aそのまま。B・Cは publish.yaml の事実確認済みの表紙文言を2か所に詰めたもの)。check_faces(お顔の頭の範囲と文字・画面端)と credit(クレジットと文字の重なり)は3枚とも通過し、画像を開いて目でも確認した。赤の装飾・絵文字・作り台詞・矢印・吹き出しなし(Aの右の愛子さまのお召し物の色は写真そのもの)。Cの右 A061 は縦長の写真のため、お顔を約215px・y約333 にしてパネルの左右にぼかしの余白が出ないようにした。Cの左 A065 は長辺338pxの写真を約3.4倍に拡大しているため、ほかの2枚より柔らかい(平成14年の写真)。パネル上端(帯の下 約25px)は同じ写真のぼかしで埋めている。Bの左パネルの右端に天皇陛下のお召し物(肩)が少し入る(お顔は入らない)
