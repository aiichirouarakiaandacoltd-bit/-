note: 2026-11-25 デザイナー(G6②)。写真は ledger の確認方法が「キャプション」または「目視確認済(当てっこ係)」のものだけ(A021・A025=ページ説明文＋目視確認済(当てっこ係)、A057・A061・A073=キャプション)。3パターンで同じ写真は使っていない。切り抜き・拡大縮小のみ。かぎかっこは宮内庁の原文の一部を一字一句(「あの幼かった愛子が」=令和3年 皇后陛下お誕生日のご感想、「生まれてきてありがとう」=平成14年4月2日 御誕生につき記者会見)で、帯の右に出典を小さく添えた。文字は各題名の言葉から取った(A=題名Aそのまま。B・Cは publish.yaml の事実確認済みの表紙文言を2か所に詰めたもの)。check_faces(お顔の頭の範囲と文字・画面端)と credit(クレジットと文字の重なり)は3枚とも通過し、画像を開いて目でも確認した。赤の装飾・絵文字・作り台詞・矢印・吹き出しなし(Aの右の愛子さまのお召し物の色は写真そのもの)。Cの右 A061 は縦長の写真のため、お顔を約215px・y約333 にしてパネルの左右にぼかしの余白が出ないようにした。Cの左は A021(令和6年 皇后陛下お誕生日のご近影・長辺1000px・等倍)。お顔は x350(型Dの x320 だとパネル右端にぼかしの余白が出るため)。パネル上端(帯の下 約25px)は同じ写真のぼかしで埋めている。Bは天皇陛下のお顔もお召し物もどちらのパネルにも入らない切り抜き(お顔の位置を境目寄りの 左x457・右x849 に置いた。大きさ約175px・高さ y305 は型Dのまま)。2026-11-25 直し係(rules_check.md 12. G6 の指摘で修正)= Bの帯右を説明の文から出典「令和元年〜令和7年のご感想より」に替え、文字を2か所・16字に/Bの切り抜きを陛下のお召し物が出ない形に/Cの左を A065(長辺338px)から A021(長辺1000px)に差し替え(言葉は平成14年・写真は令和6年。帯の出典とクレジットで年を分けて示す)/3枚ともクレジットの右余白を約25pxに(pipeline/thumb_long.py の credit に right を追加。既定は元の8px)。作り直し後も check_faces・credit は3枚とも通過、画像を開いて目で確認した
