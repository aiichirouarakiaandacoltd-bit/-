question_topic: 雅子さまのお誕生日のご感想に書かれた愛子さま
subject_area: 皇室、皇室の歴史
related_orgs: 宮内庁、皇室、その他の関係団体
body:
- 皇后になられてから雅子さまがお誕生日に公表されたご感想は、令和元年から令和7年までの7回。そのうち6回に、愛子さまのことが書かれています。宮内庁が公表している全文を、年の順にたどります。
- 18歳のお誕生日を迎えられた令和元年、成年の令和3年、ご就職の令和6年、初めての外国への公式訪問の令和7年。後半は、令和4年の成年の会見で愛子さまが語られた「生んでくれてありがとう」と、平成14年の会見で雅子さまが語られた「生まれてきてありがとう」を並べます。
- お言葉は宮内庁の公表文のとおりに引用しています。「〜かもしれません」は当チャンネルの分析です。令和8年のご感想は、この動画の制作時点では公表されていません。
- '【目次】

  0:00 「あの幼かった愛子が」

  0:32 「18才」と書かれた最初のご感想

  1:20 成年の年、ご感想はどう書き出されたのか

  1:54 1回だけ、愛子さまが出てこない年

  2:13 「まだあどけないところも残る愛子」

  2:34 佐賀県とラオス 「初めて」が続いた2年

  3:33 7回のうち6回、何が書かれていたのか

  4:14 「愛子」の文字が8回 令和7年のご感想

  5:04 愛子さまは母に何と語られたのか

  6:07 「生まれてきてありがとう」と語られた会見

  7:22 「生まれてきて」と「生んでくれて」 およそ20年を隔てた2つの言葉

  8:58 7回とも12月9日付 今年は63歳のお誕生日

  9:09 6回に共通していた「節目」'
