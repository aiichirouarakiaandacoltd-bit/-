title: '【愛子さま】シンガポール大統領の午餐会で「感銘を受けました」と述べられた、昨年訪れた場所は… #愛子さま #シンガポール #皇室'
title_before_20261126: '【愛子さま】シンガポール大統領の午餐会で「感銘を受けました」と述べられた、昨年訪れた場所とは？ #愛子さま #シンガポール
  #大阪関西万博'
thumb:
  upper: 【愛子さま】シンガポール
  middle: 昨年訪れた場所は…
