closing_question: 万博のシンガポールの展示、ご覧になりましたか？
question_topic: 愛子さまが昨年訪れて感銘を受けた場所
subject_area: 皇室、国際親善
related_orgs: 宮内庁、皇室、シンガポール政府、その他の関係団体
body:
- 令和8年11月、愛子さまは日本とシンガポールの外交関係樹立60周年の機会に、ターマン大統領のお招きでシンガポールを公式訪問されました(閣議了解の御日程は11月17日御出発・21日御帰国)。愛子さまにとって2度目の外国公式訪問です。
- 11月18日、イスタナでのターマン大統領主催午餐会のおことばで、愛子さまが「感銘を受けました」と述べられた、昨年訪れた場所とは、どこだったのでしょうか。
- おことばには、「私は、昨年、大阪・関西万博のシンガポールパビリオンを訪れ、人と動植物が共生する持続可能な未来を、最先端のデジタル技術や芸術的な空間を用いて表現した創造性豊かな展示に感銘を受けました。」とあります。宮内庁のご日程では、令和7年5月9日に「2025年日本国際博覧会会場シンガポール館」をご視察になっています。
- 宮内庁にはシンガポール館でのお写真がないため、同じ5月9日に万博会場の別の施設をご視察になったお写真を、「シンガポール館の写真ではありません」と画面に示して使っています。シンガポール館の外観は
  Wikimedia Commons の写真(2025年6〜7月撮影)です。「1年半前」は令和7年5月から令和8年11月までの当チャンネルの計算、「日本で触れたシンガポールを、現地で伝えた一文と言えるのかもしれません」は当チャンネルの分析です。
- 愛子さまのこれまでの歩みは、長い動画でたどります。あわせてご覧ください。
- 宮内庁にはシンガポールご訪問のお写真がまだ掲載されていないため、人物の写真は宮内庁が掲載している別の日のご公務・記者会見・ご近影のお写真(令和7年5月の万博ご視察を含む)で、シンガポールご訪問の時のものではありません。画面の隅に撮影日と行事を示しています(掲載ページに年月日の記載がないご近影は、年を示さずページ名だけを示しています)。シンガポールの場所の写真は
  Wikimedia Commons のもので、撮影年・作者・ライセンスを画面に示しています。
- 本動画は、記録で確認できない発言や逸話、現地の方々の反応などは含めていません。公式に確認できる出来事と、当チャンネルの分析を区別してご覧ください。
