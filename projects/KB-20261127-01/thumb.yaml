note: '2026-11-27 デザイナー(重要): KB-20261126-09 の表紙A/B(DAHcBPBcreY・DAHcBGAiOQk。テンプレート DAHatUQFKSI から複製を重ねた版)を複製して作成。テンプレート本体・元の表紙は変更していない。荒木指示(急ぎより丁寧に・一覧で目が止まる表紙・両陛下の穏やかな表情を大きく・ピースとの2枚並びと比べる)により3案を縮小して比較(1枚の寄り/左右2枚並び/上下2枚並び)し、左右2枚並び(両陛下60%・ピース40%)を採用。理由: 一覧でホッキョクグマの白い大きな顔が他の皇室の表紙と見分けやすく、両陛下が右(ピースの方向)を向かれていて視線が流れる。両陛下のお顔は1枚の寄り案に近い大きさを保った。写真の枠を1枚(写真枠)のまま左右に分割し、濃紺16pxの間隔で別の写真と分かるようにした(同じ瞬間の場面に見せない)。左 A006(宮内庁 報告 26ehime3 の kohoehime20、説明文「ホッキョクグマ作品をご覧になる天皇皇后両陛下」、提供者表記なし): 写るのは両陛下のお二人(説明文の2名と一致。左が千鳥格子の上着の女性、右が明るい灰色の上着の男性)。左のピースの絵は外した。皇族方以外の人物は体の一部も写らない。お二人とも前方を見て目線は下がらず、穏やかな笑顔。右 A013(同ページ kohoehime17、説明文「ホッキョクグマのピース」、人物なし)。加工はトリミング・拡大のみ。3段はタイトルの文言をそのまま流用(下段は「愛媛の」を外した部分)。上段104px白・中段68px金1行(15字。画面の端に掛からない最大)・下段66px白(中段より小さく)。過去の thumb.yaml を照合し kohoehime20・17 は未使用。同じ日の撮影の既作 KB-20261123-01 の表紙はお誕生日のご近影で重ならない。「写真：愛媛県」の写真(gaiehime18・19)は不使用。要確認: ピースの写真(kohoehime17)は5/17の報告ページに載る写真で、撮影日の個別の記載はない(撮影情報は報告ページの日付で表記)'
