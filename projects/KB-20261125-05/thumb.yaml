note: >-
  2026-11-25 デザイナー(G6②)。写真は台帳の【表紙候補】から、撮影者・提供者の表記なし・長辺1000px・照合済み(台帳の確認方法 A003=ページ説明文＋目視確認済(当てっこ係)/A012・A020・A022=キャプション)のものだけ。
  3パターンで同じ写真は使っていない。切り抜き・拡大縮小のみ(反転・顔の加工なし)。
  過去の全 thumb.yaml(projects/*・output/*)に出てくる台帳番号を各案件の台帳で取得元URLに直して照合し、重なる写真がないことを確かめた(A004・A014・A019・A021・A104・A105・A116・A151・A152・A153 は使用済みなので使っていない)。
  dHash でも過去の表紙の写真と比べた(最小の差 A003=23/64・A020=12/64・A022=20/64)。A012 は KB-20261125-01・-04 で以前に候補だった令和7年 新年のご近影 A073 と差8/64(同じ部屋・同じ並びの別の年の写真。どちらの案件でも最終の表紙からは外れている)。
  題材(お誕生日会見・ご家族)はお祝いの雰囲気のため、慰霊・献花・被災地の写真(A105・A106・A107・A126 など)は使っていない。皇族方以外の人物は後ろ姿・体の一部も入らない(A101 大相撲は愛子さまの後ろに関係者が写るため、A149 雅楽は後ろに関係者が写り当てっこ係が不使用としたため使わない)。
  表情はどれも穏やかな笑顔(A001 会見の写真は話している途中のため表紙には使わない)。C は右端を元の写真の x約808 で切り、棚の赤い飾り人形を入れていない。A の愛子さまのお召し物の赤茶色とイヤリングは写真そのもので、赤の装飾ではない。
  文字はどれも2か所・約20字(A 23字/B 22字/C 19字)、最大の文字は2〜5字の語(A「未知の旅」/B「一歩一歩」/C「3人」)。かぎかっこ内は令和8年2月19日の会見全文(宮内庁)の一部を一字一句(F9・F10・F16)。誰の言葉か分かるよう、引用のそばに小さく「天皇陛下」と出典「お誕生日会見より」を添えた(文字の数に入れない)。
  「未知の旅」は陛下ご自身の感じ方なので(facts.md 注意6)、「愛子さまの未知の旅」とは書いていない。
  check_faces(お顔の頭の範囲と文字の枠・画面端)と credit(クレジットと文字の重なり)は3枚とも通過。3枚と一覧 abc_overview.jpg を開いて目で確認し、過去の長尺の表紙(KB-20261125-01・KB-20261124-01)とも並べて見比べた。
  要確認: 愛子さまお一人の写真で表紙に使える長辺1000px・表記なしのものは令和7年 お誕生日のご近影(A019〜A022)しかなく、A020(赤茶のニット)と A022(ベージュのジャケット)は、KB-20261125-01 の表紙 A・B に使った A019・A021 と同じ撮影の別カット(服装が同じ)。構図・人物の左右・文字の位置は変えてある。
