note: >-
  2026-11-25 写真係(荒木指摘の直し): 「表紙Bに天皇陛下の画像がない。題名Bは陛下が愛子さまを語られた話なので根本的に違う」を受けて表紙Bを作り直した。左に写真2枚並び(左=天皇陛下お一人 A160・右=愛子さまお一人 A159 の切り抜き)、右に文字(文字・金の帯・名前の札・出典は変えていない・22字)。A160(令和8年7月28日「水の日」・「水の週間」第50回特別行事 水の未来を考える国際シンポジウムご聴講・日本科学未来館)を台帳と assets に追加した。宮内庁の掲載写真・長辺1000px・撮影者・提供者の表記なし・確認方法キャプション。表紙Aの A158(7月6日)とは別の行事。口を閉じた穏やかな笑顔で、お話の途中ではない。左右の隣席の方(皇族方以外)は切り抜きで外した。A159 は愛子さまのお顔中心に切り抜き直し(皇族方以外は入れない。右端に皇后陛下が少し入る)。お顔の大きさは目から顎までの長さで約130pxにそろえた。過去の全 thumb.yaml の写真に令和8年7月28日の撮影はなく、dHash の最小の差は A160=18/64。check_faces・credit は通過。thumb_B.png と abc_overview.jpg を開いて目で確認し、A(文字 左・陛下お一人 右)・C(ご一家1枚いっぱい)と構図が違うことを確かめた。
  2026-11-25 写真係兼デザイナー(G6 直しE)。確認係の指摘(rules_check.md 7-1: 表紙Aの A003・A020、表紙Bの A022 が過去の表紙と同じ撮影・すべてご近影)を受けて、表紙A・Bの写真を行事の場面に差し替えた。表紙C(A012)はそのまま。
  A158(令和8年7月6日 第82回日本芸術院授賞式・陛下お一人・笑顔で拍手)と A159(令和8年10月3日 アジア競技大会 障害馬術ご覧・両陛下と愛子さま)を台帳と assets に追加した。どちらも宮内庁の掲載写真で、長辺1000px・撮影者・提供者の表記なし・確認方法キャプション。
  A は題名Aが陛下のお言葉なので陛下お一人に(進行役の判断。2枚並びはやめた)。下端の手前の方の頭(元の写真 y630〜)と右下の端は切り抜きで外した。B は皇后陛下と愛子さまのお二方だけを切り抜いた(左の男性・左奥の男性2名・サングラスの男性・右の男性は入れない。皇族方どうしの写り込みは可という進行役の判断で、右端に陛下の髪と上着が少し入る)。
  表情は3枚とも穏やかな笑顔(話している途中の写真は使わない)。お祝いの題材に合わない献花・慰霊・被災地の写真は使っていない。
  過去の全 thumb.yaml(projects/*)の写真を各台帳の取得元URLに直して照合し、同じ写真・同じ日の撮影がないことを確かめた(過去の表紙は令和8年 5/31・6/17・6/19・6/20・6/25・10/11・10/29・11/3・11/4・11/8・3/8・4/6 の行事とご近影。7/6・10/3 はない)。dHash で過去の表紙の写真42枚と比べた最小の差は A158=24/64・A159=22/64。
  3枚で構図を変えている(A=文字 左・陛下お一人 右/B=写真 左・お二方・文字 右＋金の帯/C=写真いっぱい・下に引用)。文字・名前の札・出典・文字数は変えていない(A 23字/B 22字/C 19字)。
  check_faces(お顔の頭の範囲と文字の枠・画面端)と credit(クレジットと文字の重なり)は3枚とも通過。3枚と abc_overview.jpg を開いて目で確認し、過去の表紙(KB-20261125-01・KB-20261124-01・KB-20261123-01)と並べて、写真・服装・背景で見分けられることを確かめた。
  探した範囲で、愛子さまお一人で条件をすべて満たす行事の写真はなかった(令和7年の行事ページは長辺400px、令和8年の愛子さまお一人の写真はほぼ提供表記あり、日本フィル 6/22 は写真内に © 表記)。
