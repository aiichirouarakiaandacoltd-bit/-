question_topic: 陛下のお誕生日会見のお言葉と愛子さまの1年
subject_area: 皇室、皇室の歴史
related_orgs: 宮内庁、皇室、日本赤十字社、その他の関係団体
body:
- 「言わば「未知の旅」のように感じられ」。令和8年2月19日、66歳のお誕生日に際しての記者会見で、天皇陛下はこう語られました。陛下にとって、何が「未知の旅」なのでしょうか。宮内庁が公表している会見の全文と、愛子さまのご日程の記録から確かめます。
- 会見の時点で、愛子さまは日本赤十字社にお勤めになって間もなく2年。陛下は職場でのご様子について「社会人として一歩一歩成長していることが感じられ、うれしく思っています」と語られています。ご就職の時に愛子さまが記された文書回答もあわせて紹介します。
- 後半は、会見までの1年に愛子さまが重ねられた経験を日付の順にたどります。令和7年5月の能登半島地震の被災地、9月の防災推進国民大会2025(新潟県)、11月の初めての公式外国訪問となったラオス、戦後80年にご一家3人で訪ねられた沖縄県・長崎県・東京都慰霊堂・昭和館。会見のあとの福島県・鳥取県にも触れ、最後はご家族についてのお言葉で締めくくります。
- お言葉は宮内庁の公表文のとおりに引用しています。「読むことができます」「〜かもしれません」と述べている部分は当チャンネルの分析です。宮内庁の記録で確かめられない内容は扱っていません。
- '【目次】

  0:00 陛下にとって、何が「未知の旅」なのか

  0:55 「社会人として3年目を迎えようとしています」

  1:32 「背中を押していただき」 就職の時の文書回答

  2:57 「いわゆる社会で仕事をした経験のない私にとっては」

  3:58 愛子さまはこの1年、どんな経験を重ねられたのか

  4:57 令和7年5月18日 能登半島地震の被災地へ

  5:24 令和7年9月 なぜ新潟県へ？ 防災推進国民大会2025

  6:41 令和7年11月 初めての公式外国訪問 ラオス

  7:45 戦後80年 3人で訪ねられた4つの場所

  8:50 会見のあと 福島県、そして鳥取県へ

  9:26 「愛子と3人で過ごす時間は」'
