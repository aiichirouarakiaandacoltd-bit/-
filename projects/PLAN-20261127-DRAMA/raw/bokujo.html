        </figure>
        <p class="c-text">御料牧場は、栃木県塩谷郡高根沢町・芳賀郡芳賀町にまたがる地（宇都宮市中心街から北東約13キロメートル）にあります。農・畜産事業の総合的経営を行う牧場で、皇室用の乗用馬・輓（ばん）用馬の生産をはじめ、各種家畜・家禽の飼養管理や皇室・内外賓客接伴用の牛乳・肉・卵などの生産を行い、在日外交団の接遇の場としても使用されています。</p>
