# 長尺のABテスト(荒木決定 2026-11-28: 今後の長尺はこの3つの型で行う)
# 表紙の文字はすべて、その題名の言葉から取る(第9章②)。「」は宮内庁の原文と一字一句同じ(raw/empress2025.txt)
ab_tests:
  - id: A
    kata: 明朝の型(写真2枚を並べる・2段 白/黄)
    kirikuchi: 数字・事実型
    title: "【雅子さま】戦後80年の想い「あと20年で100年もの月日が」 終戦の年に生まれた方は80歳に… 昨年のご感想より #雅子さま #皇后陛下 #戦後80年"
    thumb: thumb_A.png
    thumb_text: ["「あと20年で100年もの月日が」", "戦後80年の想い"]
  - id: B
    kata: 見本の型(上の黒帯に「」・お顔を大きく・3段 白/水色/ピンク)
    kirikuchi: 強い疑問型
    title: "【雅子さま】63歳のお誕生日 戦後80年に綴られた想いとは…「あと20年で100年もの月日が」 #雅子さま #皇后陛下 #皇室"
    thumb: thumb_B.png
    thumb_text: ["「あと20年で100年もの月日が」", "63歳 雅子さまのお誕生日", "戦後80年に綴られた想いとは…"]
  - id: C
    kata: 大写しの型(両陛下を大きく・3段 水色/白/黄)
    kirikuchi: 人物の物語型
    title: "【雅子さま】12月9日 63歳のお誕生日 陛下とともに歩まれた1年 雅子さまの願いとは…「あと20年で100年もの月日が」 #雅子さま #天皇陛下 #皇室"
    thumb: thumb_C.png
    thumb_text: ["12月9日 63歳のお誕生日", "「あと20年で100年もの月日が」", "雅子さまの願いとは…"]
short_cover:
  - short_cover_1.png          # 黒い帯の型
  - short_cover_2_raised.png   # 同じ内容を、これまでのパターンB(上寄せ型)と同じ比率に引き上げた版(中身 y60〜1400、下は空ける)
notes:
  - "終戦の年に生まれた方は80歳に: 原文「終戦の年に生まれた方がもう80才になられる年であり」の言い換え"
  - "願い: 原文「語り継いでいかれることを願うとともに」"
  - "63歳: 昭和38年(1963年)12月9日お生まれ → 令和8年(2026年)12月9日で63歳"
