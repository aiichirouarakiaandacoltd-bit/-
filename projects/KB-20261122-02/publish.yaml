# 公開用テキスト(本書第9章)。タイトル→表紙3段→説明文の順に作る
# 企画係 2026-11-23: 第4案(11/23 再調査)天皇陛下 この秋の宮殿。G0提示タイトル(82文字・ハッシュタグ3個)。荒木さん承認済み(2026-11-23)
# タイトル係 2026-11-23: G0承認タイトルを確定。変更は1語のみ「手渡す」→「授ける」
#   理由: facts.md F3/F4 で宮内庁の言い方は「天皇陛下から受章者に文化勲章が授与され」。「手渡す」は当チャンネルの言いかえ(分析)で、
#   タイトル末尾「宮内庁の記録から」と並べると宮内庁の表現に見えるため、「授与」に沿う「授ける」に最小限で直した
#   「ベトナム主席ご夫妻」は facts.md 表記の決まりで略称可(タイトル表記と同じ)のため変更なし
# 候補3案(通りすがり係の観点=最初の2秒で止まるか):
#   採用 A: 上記(承認タイトルの修正版)。疑問文が冒頭近くにあり、具体語(松の間・茶会・ベトナム)と根拠(宮内庁)がそろう
#   落選 B: 「【天皇陛下 この秋の宮殿】松の間で何が？文化勲章親授式…」→疑問が抽象的で2秒で中身が伝わらない。G0承認文からの変更も大きい
#   落選 C: 「【この秋の宮殿】天皇陛下は誰を迎えられた？…」→文化勲章(11/3の旬の具体語)が後ろに下がり止まりにくい。G0承認文からの変更も大きい
title: "【天皇陛下 この秋の宮殿】文化勲章は誰がどこで授ける？松の間の親授式、受章者との茶会、ベトナム主席ご夫妻とのご会見…宮内庁の記録から #天皇陛下 #皇室 #文化勲章"
# 表紙(第9章②・第5章): 3段はタイトルの文言から流用(足していない)。中心画像 A008=2026-11-03 文化勲章親授式(宮殿 松の間)、
#   天皇陛下が明るく大きく写りお顔がはっきり。皇族は陛下お一人。陛下と受章者の2人にトリミング想定(右奥の人物は切る)。赤なし
#   A013(大綬章)は勲章・箱に赤が入るため不採用
thumb: {upper: "文化勲章は", middle: "誰がどこで授ける？", lower: "宮内庁の記録から", center_image: "A008"}
# 説明文係 2026-11-23: 本文は facts.md の公式事実(F1〜F3・F5〜F17)だけ。会場名「連翠」「竹の間」、受章者名・人数、陛下のお言葉、首相の所作(勲記の伝達)、
#   皇嗣同妃両殿下・佳子内親王殿下のお名前は入れない。「親授」は宮内庁の言い方「天皇陛下から受章者に文化勲章が授与される」に沿う
#   references の資料名は 2026-11-23 に curl で取得した各ページの見出し。宮殿の写真ページは旧URL(about/shisetsu/…)が learn/institution/… へ転送されるため転送先URLを記載
#   未確認情報は動画で紹介していないので unconfirmed_note は省略(既定文)
question_topic: "この秋、宮殿で行われた文化勲章親授式や外国の賓客とのご会見"
subject_area: "皇室、宮中行事、国際親善"
related_orgs: "宮内庁、皇室、政府機関、各国大使館、その他の関係団体"
body:
  - "令和8年11月3日、天皇陛下は宮殿 松の間で文化勲章親授式に臨まれました。"
  - "文化勲章は、誰が、どこで授けるのでしょうか。"
  - "宮内庁によると、文化勲章親授式は毎年11月3日に皇居で行われ、天皇陛下から受章者に文化勲章が授与されます。松の間は宮殿内で最も格調高い部屋とされています。"
  - "10月20日、天皇皇后両陛下は御所でタイ王妃陛下とお茶をともにされました。10月28日には松の間で信任状捧呈式が行われ、ペルーとガーナの新任大使が信任状を捧呈しました。"
  - "11月3日の親授式の翌日には、天皇皇后両陛下と愛子内親王殿下が、宮殿で文化勲章受章者及び文化功労者等を招いた茶会に臨まれました。11月10日には同じ松の間で令和8年秋の勲章親授式が行われました。11月11日、両陛下は宮殿でベトナム主席ご夫妻(公式実務訪問賓客)とご会見になり、午餐をともにされました。"
  - "今回の動画では、宮内庁のご日程と写真の説明文をもとに、この秋の宮殿での陛下のご活動を日付順にたどります。"
  - "宮内庁の記録で確認できない会場名、発言、逸話は含めていません。「自ら手渡される」は、宮内庁の説明をもとにした当チャンネルの言いかえです。"
  - "公式に確認できる出来事と、当チャンネルの解説を区別してご覧ください。"
