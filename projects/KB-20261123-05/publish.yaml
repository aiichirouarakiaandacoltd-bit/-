# G6① タイトル係 2026-11-23: title は G0承認・G1後の最小修正のまま確定。73字・ハッシュタグ3個・NG語なし。
#   facts.md と照合: 「迎えた子どもたち」=1階中央ホールで花束のお渡し等で歓迎した治療を受けている子どもたち(F3・F4・F5)。
#   「マキシマ王妃ゆかりの」はQ1「マキシマ王妃が情熱を持って関与していらっしゃる」の範囲(F12)。名前の由来(F13・確認できず)は言っていない。
#   「雅子さまと子どもたち」は写真説明「子どもから花束をお受け取りになる皇后陛下」(F5)。表記「小児がんセンター」「子どもたち」は台本・字幕と同じ。
#   落とした案: 「【雅子さまと子どもたち】プリンセス・マキシマ小児がんセンターで、両陛下を迎えた子どもたちとは？…」→正式名で正確だが長く、2秒で読めるのは「プリンセス・マキシマ」まで。場面(子どもたち)が後ろに下がり不採用。
#   「【雅子さまと花束】小児がんセンターで、花束を渡した子どもたちとは？…」→答え(治療を受けている子どもたちと家族)の一部だけに寄り、承認タイトル・台本の問いからも変わるため不採用。
