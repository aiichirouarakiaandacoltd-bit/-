# G6③ 説明文係 2026-11-23: 本文は facts.md の公式事実(F1・F3・F6・F8・F11・F12・F14)と引用Q1(和訳と明示)・Q2(一字一句)だけ。
#   王妃が案内したとは書かない(F7)。子どもの病状・年齢・人数・気持ちは書かない。施設名の由来(F13)は書かない。未確認情報の紹介なし→unconfirmed_note 省略。
question_topic: 小児がんセンターで両陛下を迎えた子どもたちと、帰国後のご感想
subject_area: 皇室、国際親善
related_orgs: 宮内庁、皇室、オランダ王室、政府機関、その他の関係団体
body:
- 令和8年6月19日、オランダをご訪問中の天皇皇后両陛下は、国王王妃両陛下と共に、プリンセス・マキシマ小児がんセンターをご訪問になりました。
- このとき、両陛下を迎えた子どもたちとは、どのような子どもたちだったのでしょうか。
- その2日前の6月17日、晩餐会のおことば(宮内庁掲載の和訳)で、天皇陛下はこのセンターについて「マキシマ王妃が情熱を持って関与していらっしゃるプリンセス・マキシマ小児がんセンターを視察する予定ですが、日蘭の研究協力が子供達の将来のために活かされることを願ってやみません。」と述べられています。
- 宮内庁のご訪問の報告によると、このセンターは、オランダ国内すべての小児がん患者に対する治療と研究を担う専用施設として2018年に開所した、ヨーロッパ最大の小児がんセンターです。
- 6月19日、両陛下は同センターの1階中央ホールで、治療を受けている子どもから花束のお渡し等の歓迎をお受けになり、その家族とご交流になりました。その後、理事等から施設や研究についての説明をお受けになり、研究者等とご懇談になりました。
- 帰国後の6月26日に公表された天皇皇后両陛下のご感想には、「オランダのプリンセス・マキシマ小児がんセンターでは、高度な医療の研究と子どもたちや家族に寄り添った医療がなされていることに感銘を受けました。」とあります。
- 両陛下を迎えたのは、治療を受けている子どもたちと、その家族です。
- 訪問前のおことばにも、帰国後のご感想にも、子どもたちのことが語られています。子どもたちの将来を願う訪問だったのかもしれない、というのが当チャンネルの分析です。
- 今回の動画では、宮内庁の記録をもとに、訪問前のおことばから迎えの場面、帰国後のご感想までをたどります。別の日の写真を使った場面では、画面に実際の撮影日と行事を表示しています。
- 子どもたちの病状や年齢、人数、その場での会話は宮内庁の記録で確認できないため、扱っていません。引用は宮内庁の掲載文と同じ文字で記しています。
- 公式に確認できる出来事と、当チャンネルの解説を区別してご覧ください。
