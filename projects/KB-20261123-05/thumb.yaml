texts:
  upper: 両陛下を迎えた
  middle: 子どもたちとは？
  lower: 小児がんセンターで
photos:
- ledger: A003
center_image: A003
note: 3段はタイトル「…小児がんセンターで、両陛下を迎えた子どもたちとは？…」の文言をそのまま流用(足した言葉なし。上段7字・中段8字・下段9字、各1行)。上段→中段で「両陛下を迎えた子どもたちとは？」の問いが2秒で読めるよう、場面→疑問→場所の順(KB-20261123-04と同じ並べ方)。A003(kou260619-01-01-03、宮内庁写真説明「治療を受けている子どもから花束をお受け取りになる皇后陛下」、キャプション確認済み)。人物は皇后陛下1人(笑顔の横顔が大きく分かる)。元画像では左側に花束を渡す子ども(マスク・顔が識別できる)と家族が写るため、子どもが写らない範囲で切り抜く前提:トリミング
  x440〜1000・y0〜666(560×666、皇后陛下と花束のみ。子ども・家族の顔は入らない。左端の背景は顔の写らない大人の服のみ)。赤は花束の赤いバラだけ(切り抜き範囲の約1%)で大きく入らない。服は淡いピンクの花柄。加工はトリミング・拡大縮小・明るさの軽い補正のみ。second_image
  なし。別案A002(天皇陛下のお顔が大きく、皇后陛下は右端。子どもを外すと幅約340pxで拡大が3倍近くになり画質が落ちる)。A060(両陛下と国王王妃両陛下・子どもたちの全景。お顔が小さく子どもの顔も多い)。依頼文の「A006」は桜植樹(アムステルダムの森公園)の写真で同センターの写真ではないため候補外(要確認)。
