note: 3段はタイトルの文言をそのまま流用(足した言葉なし。上段8字・中段9字・下段13字、各1行)。A002(kou260619-01-02-02、宮内庁写真説明「若木の植え際に盛り土をおかけになる天皇皇后両陛下」、キャプション確認済み・A069と同一ファイル)。人物は両陛下の2人。皇后陛下は横顔で笑顔まで分かる。天皇陛下はうつむいた横顔で、お顔は分かるが目元は下向き(要確認)。赤の大きな部分なし(皇后陛下の上着は淡いピンクの花柄・緑地)。トリミング案は全幅(x60〜960・y150〜620)で両陛下と若木を入れる。加工はトリミング・拡大縮小・明るさの軽い補正のみ。second_image
  なし。別案A003(両陛下が正面でお顔がはっきり分かるが小さく、写真個別の説明なし=要目視)。A001(お顔は大きいが若木が写らず、写真個別の説明なし=要目視)
