texts:
  upper: 愛子さまの成年会見
  middle: 語られた一言とは？
  lower: 母の言葉に掛けて、両陛下へ
photos:
- ledger: A104
center_image: A104
note: '2026-11-25 荒木指示「全ていつも使用している画像です。変化がなく飽きてます」で中心画像を差し替え(デザイナー): A057→A104。A104(令和8年11月4日「ルーヴル美術館展
  ルネサンス」(国立新美術館)をご覧になる天皇皇后両陛下並びに愛子内親王殿下、宮内庁キャプション、1000px)から愛子さまお一人の範囲。推奨のA110(園遊会)は愛子さまのお顔のすぐ右後ろに招待客のお顔があり、正方形の切り抜きで外すと約200pxになるため不採用。A104は一般の方が写っておらず、白い壁・ローズ色のスーツでS2(ご供花・濃紺)・S3(園遊会・和装)と見分けられる。要確認:
  上段「愛子さまの成年会見」(令和4年)に令和8年の写真(写真下に年月日と行事を明記)。お召し物のローズ色は写真そのもの(着色なし)。 加工はトリミング・拡大縮小のみ。thumb_canva
  --fetch の検査(1080×1920・写真枠外の赤0)をA・Bとも通過。 / 旧: 2026-11-25 荒木指示で中心画像を差し替え(デザイナー): 旧A061(成年会見・お話し中の表情)→A057(令和7年12月1日掲載
  愛子内親王殿下のお誕生日に際してのご近影、宮内庁、1000px)。成年会見の写真A142は400×266で正方形に切ると約266pxとなり粗いため不採用。表情が穏やかな笑顔のご近影にし、S2(A059)・S3(A073)と服装・背景で見分けられるようにした。写真下に「令和7年」を明記(要確認:
  上段「愛子さまの成年会見」に令和7年の写真)。お召し物の臙脂色は写真そのもの(着色なし。thumb_canva の赤検査は写真枠外0)。加工はトリミング・拡大縮小のみ。
  / 旧: 3段はタイトルの文言をそのまま流用(足した言葉なし。上段9字・中段9字・下段13字、各1行)。A061(宮内庁 写真説明「記者会見をなさる愛子内親王殿下（御所大広間）」令和4年3月17日、会見当日の写真)。お顔は正面で大きい。加工はトリミング・拡大縮小のみ。'
