note: '2026-11-25 荒木指示で中心画像を差し替え(デザイナー): 旧A061(成年会見・お話し中の表情)→A057(令和7年12月1日掲載 愛子内親王殿下のお誕生日に際してのご近影、宮内庁、1000px)。成年会見の写真A142は400×266で正方形に切ると約266pxとなり粗いため不採用。表情が穏やかな笑顔のご近影にし、S2(A059)・S3(A073)と服装・背景で見分けられるようにした。写真下に「令和7年」を明記(要確認:
  上段「愛子さまの成年会見」に令和7年の写真)。お召し物の臙脂色は写真そのもの(着色なし。thumb_canva の赤検査は写真枠外0)。加工はトリミング・拡大縮小のみ。
  / 旧: 3段はタイトルの文言をそのまま流用(足した言葉なし。上段9字・中段9字・下段13字、各1行)。A061(宮内庁 写真説明「記者会見をなさる愛子内親王殿下（御所大広間）」令和4年3月17日、会見当日の写真)。お顔は正面で大きい。加工はトリミング・拡大縮小のみ。'
