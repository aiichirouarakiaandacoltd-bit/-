closing_question: 皆さまなら、ご両親へどんな言葉を伝えますか？
question_topic: 愛子さまが成年の記者会見で両陛下へ伝えたいと語られた言葉
subject_area: 皇室、皇室の歴史
related_orgs: 宮内庁、皇室、その他の関係団体
body:
- 愛子さまは令和3年12月1日に20歳の成年を迎えられ、翌年の令和4年3月17日、御所大広間で成年をお迎えになっての記者会見に臨まれました。
- 記者から、両陛下に伝えたい言葉を尋ねられたとき、愛子さまが挙げられた一言とは何だったのでしょうか。
- 愛子さまはお答えの中で、「母の「生まれてきてくれてありがとう」という言葉に掛けて，私も「生んでくれてありがとう」と伝えたいと思います。」と述べられました。
- 同じお答えでは、続けてご両親へのお礼を伝えたいと述べられ、「これからもどうかお体を大切に。これからも長く一緒に時間を過ごせますように」という言葉も添えたいと語られています。
- 今回の動画では、宮内庁が公開している成年の記者会見の全文から、このお答えの一場面をたどります。お言葉は会見全文と同じ文字で記しています。「親子の言葉が重なった場面と言えるのかもしれません」は当チャンネルの分析です。
- 雅子さまのお誕生日のご感想に書かれた愛子さまのことは、長い動画でたどります。あわせてご覧ください。
- 写真は、宮内庁が掲載している成年の記者会見のお写真(令和4年3月17日)、愛子さまのお誕生日に際してのご近影(令和3年・令和7年)、雅子さまのお誕生日に際してのご近影(令和4年・令和6年)、新年をお迎えになったご一家のご近影(令和4年・令和7年・令和8年)です。画面の隅に撮影日(ご近影は掲載された年と行事)を示しています。表紙の写真は、宮内庁が掲載している令和8年11月4日「ルーヴル美術館展 ルネサンス」(国立新美術館)をご覧になった際のお写真です。
- 本動画は、記録で確認できない発言や逸話は含めていません。公式に確認できる出来事と、当チャンネルの分析を区別してご覧ください。
