note: '2026-11-26 デザイナー(重要): 荒木指示「表紙の画像を変更」「A133はしょっちゅう出てくる」により A133 から A061 に変更。A061=宮内庁「天皇ご一家のご活動」掲載、説明文「第23回世界災害救急医学会開会式でおことばを述べられる愛子内親王殿下
  （京王プラザホテル）」、令和7年5月3日(月別ご日程で確定)、1000×666、撮影者・提供者表記なし、愛子さまお一人のみ(皇族方以外は写らない)。選んだ理由:
  日本赤十字社に関わる宮内庁の写真(A040 日赤企画展=直近の本編3回・全員マスク・400px/佐賀県赤十字血液センター=本編3回・400pxで隣の関係者を外すと約6倍拡大/A039
  ご供花=献花のため不可)はどれも使用回数が多いか表紙の条件に合わないため、災害救護に近い災害救急医学の国際学会の場面で、直近の本編・表紙での使用が少ないもの(本編2回
  KB-20261126-01・-03、表紙0回)を選んだ。過去の全 thumb.yaml と照合し表紙で未使用・同じ日の撮影もなし。行事の場面(ご近影ではない)。加工はトリミング・拡大縮小のみ(約1.7倍)。3本並べ(projects/KB-20261126-01/thumb/shorts_02-04_covers_overview.jpg)で
  -02 A091(金の椅子・ラオスの衣装)・-04 A167(防災訓練・屋外・皇后陛下と)と見分けられることを確認。thumb_canva --fetch の検査(1080×1920・写真枠外の赤0)をA・Bとも通過。要確認:
  日赤の行事そのものの写真ではない(写真下に年月日と行事を明記)。おことばの途中の表情(口元が開く)。'
