title: '【天皇陛下が語る愛子さま】即位後7回のお誕生日会見で語られた、娘・愛子さまについての言葉とは？宮内庁の会見記録から #天皇陛下 #愛子さま #皇室'
closing_question: 皆さんの心に残ったのは、どの年の言葉ですか？
thumb:
  upper: 娘・愛子さまについての
  middle: 言葉とは？
  lower: 天皇陛下が語る
