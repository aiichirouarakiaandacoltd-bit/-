question_topic: 天皇陛下がお誕生日の記者会見で語られた愛子さまについての言葉
subject_area: 皇室、宮中行事、国際親善
related_orgs: 宮内庁、皇室、日本赤十字社、その他の関係団体
body:
- 天皇陛下は即位後、令和2年から令和8年までの7回のお誕生日会見すべてで、記者の質問に答える形で愛子さまについて語られました。
- その7回すべてに出てくる、愛子さまについての2つの言葉とは何でしょうか。
- 令和2年の会見では、大学の合格通知を会見の当日に受けたことに触れ、「とても喜んでおります」と述べられました。
- 令和3年の会見では、大学生になった愛子さまのオンライン授業に触れられました。
- 令和4年の会見では、成年について「小さかった愛子がもう二十歳になった」と述べられました。
- 令和5年の会見では、成年を迎えての初めての記者会見について「安堵いたしました」と語られました。
- 令和6年の会見では、4月からの日本赤十字社での勤務に触れ、「いずれ海外への訪問というものもあるのではないか」とも語られました。
- 令和7年の会見では、初めて単独での地方の公務として佐賀県を訪問されたことに触れられました。
- 令和8年の会見では、ラオスへの「初めての公式外国訪問」について語られました。2年前の「いずれ海外への訪問」が、実現した形です。
- 答えは「感謝」と「思いやり」です。7回すべてに入っており、語順は「感謝と思いやり」(令和2・3・7・8年)と「思いやりと感謝」(令和4・5・6年)の2通りです。
- 合格、成年、初めての外国訪問と、節目ごとに同じ願いを伝えてこられたのは、娘の歩みを見守る親としての願いなのかもしれません。これは当チャンネルの分析です。
- 今回の動画では、宮内庁の7回の会見全文をもとに、陛下の言葉を年の順にたどります。写真は令和8年のもので、各年の会見の写真ではありません。
- 引用は会見全文と同じ文字で記し、記録で確認できない発言や逸話は含めていません。
