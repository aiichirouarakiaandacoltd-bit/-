# G6③ 説明文係 2026-11-23: 引用は facts.md(E2020〜E2026 全文照合済み)の部分一致のみ。会場・ラオス訪問の日付は書かない。「毎年」「頼もしく」不使用。愛子さまご自身の言葉(令和3・6年)は使わない。
question_topic: 天皇陛下がお誕生日の記者会見で語られた愛子さまについての言葉
subject_area: 皇室、宮中行事、国際親善
related_orgs: 宮内庁、皇室、日本赤十字社、その他の関係団体
body:
- 天皇陛下は即位後、令和2年から令和8年までの7回、お誕生日を前に記者会見に臨まれ、7回すべてで、記者の質問に答える形で愛子さまについて語られました。
- その7回すべてに出てくる、愛子さまについての2つの言葉とは何でしょうか。
- 令和2年の会見では、学習院大学文学部日本語日本文学科への合格通知を会見の当日に受けたことに触れ、「希望の進学先に進めることを，愛子はもとより，私も雅子もとても喜んでおります。」と述べられました。
- 令和3年の会見では、大学生になった愛子さまについて、新型コロナウイルス感染症の影響で「オンラインでの授業が続いておりますが，」と語られました。
- 令和4年の会見では、前年12月に成年を迎えられたことについて、「小さかった愛子がもう二十歳になった」と述べられました。
- 令和5年の会見では、成年を迎えての初めての記者会見について、「無事に会見を終えることができ、安堵いたしました。」と語られました。
- 令和6年の会見では、卒業を間近に控えた愛子さまに、4月から「日赤の一員として多くの人のお役に立てるよう努力を続けてほしい」と述べられました。関連質問への答えでは「いずれ海外への訪問というものもあるのではないか」とも語られています。
- 令和7年の会見では、日本赤十字社での勤務がまもなく1年になることや、初めて単独での地方の公務として国民スポーツ大会のために佐賀県を訪問されたことに触れられました。
- 令和8年の会見では、ラオスへの「初めての公式外国訪問」について、「心を込めて務めを果たしてくれたことをうれしく思っています。」と述べられました。
- 令和6年に「いずれ海外への訪問」と語られてから2年後、令和8年の会見では、それが実際の訪問として語られたことになります。
- 答えは「感謝」と「思いやり」です。7回すべての会見に、この2つが入っています。語順は、令和2・3・7・8年が「感謝と思いやり」、令和4・5・6年が「思いやりと感謝」の2通りです。令和2年は学びについて、その後は務めについての言葉です。
- 大学合格、成年、社会人、初めての外国訪問と、節目ごとに同じ願いを伝えてこられたのは、娘の歩みを見守る親としての願いと言えそうだ、というのが当チャンネルの分析です。
- 今回の動画では、宮内庁の7回の会見全文をもとに、陛下の言葉を年の順にたどります。写真はすべて令和8年のご公務などのもので、各年の会見やその年の出来事の写真ではありません。
- 引用は会見全文と同じ文字で記し、宮内庁の記録で確認できない発言や逸話は含めていません。
- 公式に確認できる出来事と、当チャンネルの解説を区別してご覧ください。
