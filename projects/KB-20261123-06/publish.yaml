title: "【天皇陛下が語る愛子さま】即位後7回のお誕生日会見で語られた、娘・愛子さまについての言葉とは？宮内庁の会見記録から #天皇陛下 #愛子さま #皇室"
closing_question: "皆さんの心に残ったのは、どの年の言葉ですか？"
# G6① タイトル係 2026-11-23: title は G1後の最小修正版のまま確定(73字・ハッシュタグ3個)。facts.md F8〜F10・F44〜F46 と照合し、ずれなし
#   (「即位後7回のお誕生日会見」=F8、「語られた」「について」=記者の質問への答えで宛てた言葉ではない F10、「宮内庁の会見記録から」=E2020〜E2026)。NG語なし。
#   採用案A(現タイトル):【天皇陛下が語る愛子さま】は人物2人が最初の2秒で分かり、「言葉とは？」で答えのある疑問になる。
#   落とした案B:「【天皇陛下が語る愛子さま】7回の会見で毎回語られた2つの言葉とは？…」→冒頭の問い(01-1)とは合うが、「感謝」「思いやり」の語順が2通り(F45)で「同じ2つの言葉」と読まれるおそれ。G0/G1で承認済みの文言を変える理由として弱い。
#   落とした案C:「【愛子さまの歩み】大学合格からラオスまで、天皇陛下が会見で語られた言葉とは？…」→具体語は増えるが、語る人(天皇陛下)が後ろに下がり2秒で止まりにくい。「ラオス」は外国要人の反応と誤読されるおそれ。
# G6② 表紙3段(タイトル係): タイトル「…娘・愛子さまについての言葉とは？…」「【天皇陛下が語る愛子さま】」の文言をそのまま流用(足した言葉なし)。
#   上段11字(愛子さまのお名前)→中段5字(最も強い疑問)→下段7字(語る人)。中段は「ついての言葉とは？」(9字)では助詞始まりで読みにくいため5字とした(要確認: 目安8〜9字より短い)。
#   中心画像 A017(東京六大学野球春季リーグ戦、令和8年5月31日、宮内庁キャプション確認済み)。人物は天皇陛下と愛子さまの2人だけ・お二人ともカメラ側を向いた笑顔でお顔が大きく分かる・赤なし。second_image なし。
