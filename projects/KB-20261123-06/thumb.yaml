note: 3段はタイトル「【天皇陛下が語る愛子さま】即位後7回のお誕生日会見で語られた、娘・愛子さまについての言葉とは？…」の文言をそのまま流用(足した言葉なし。上段11字・中段5字・下段7字、各1行)。上段→中段で「娘・愛子さまについての言葉とは？」の問いが2秒で読め、下段で語る人(天皇陛下)を示す。愛子さまのお名前を上段に入れた。中段5字は目安(8〜9字)より短い(要確認。「ついての言葉とは？」は助詞始まりのため不採用)。
  A017(koho260531-01-01-01、宮内庁写真説明「令和8年度東京六大学野球春季リーグ戦をご覧になる天皇陛下、愛子内親王殿下」、キャプション確認済み)。写るのは天皇陛下と愛子さまの2人だけで、お二人ともこちらを向いた笑顔でお顔が大きく分かる。服は淡いグレーと淡い緑、背景は暗い格子、下端は青。赤は0%(全体の色判定)。切り抜きの目安
  x150〜850・y130〜730(お二人と上半身。左端x0〜20に写る他の人の手は入れない)。加工はトリミング・拡大縮小・明るさの軽い補正のみ。second_image
  なし。 別案A087(秋季雅楽演奏会、令和8年10月24日。お二人が向き合う笑顔で温かいが、後ろに随員3人のお顔が写り第5章の人物1〜2人に収まらない。手前の朱色の手すり・椅子の赤い柄で全体の赤8%)。A094(全日本ソフトテニス選手権、お顔は大きいが写真個別の説明がなくページ末尾の説明文のみ。後ろの人の赤いネクタイ・赤い札が入る)。
