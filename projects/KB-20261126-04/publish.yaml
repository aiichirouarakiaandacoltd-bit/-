question_topic: シンガポールご訪問のご感想に愛子さまが書かれた「受け継いでいく」もの
subject_area: 皇室、国際親善
related_orgs: 宮内庁、皇室、シンガポール政府、その他の関係団体
body:
- 令和8年11月17日から21日まで、愛子さまは日本とシンガポールの外交関係樹立60周年の機会に、ターマン大統領のお招きでシンガポールを訪問されました。愛子さまにとって2度目の外国公式訪問です。
- ご訪問を終えてのご感想に、愛子さまが「受け継いでいくことができれば」と書かれたものとは、何だったのでしょうか。
- 11月18日の大統領主催午餐会のおことばで、愛子さまは、1970年に上皇上皇后両陛下(当時は皇太子同妃両殿下)がジュロン地区の一角にソテツの木を植樹なさったことに触れ、「今では立派な日本庭園となったその地を、今回私も訪れることを楽しみにしています。」と述べられました。
- 11月21日のご感想には、日本庭園でそのソテツの隣にフクギを植樹されたこと、シンガポール植物園で愛子さまの名を付けた蘭の命名式が行われたことが書かれています。そして最後の段落に、「これまで上皇上皇后両陛下、天皇皇后両陛下を始め、皇室の方々が大切に育んでこられたシンガポールとの友好親善の歩みを、私も受け継いでいくことができれば幸いに存じます。」とつづられています。
- 今回の動画では、宮内庁が公開しているご感想とおことばの全文から、この一文をたどります。お言葉は宮内庁の公表文と同じ文字で記しています。「世代を超えて歩みをつなぐ一文と言えるのかもしれません」は当チャンネルの分析です。蘭の名称や植樹の日付など、宮内庁の公表文にない内容は扱っていません。
- 愛子さまの25年の歩みは、長い動画「愛子さま25年の軌跡」でたどります。あわせてご覧ください。
- 人物の写真は宮内庁が掲載しているご近影やご公務のお写真で、シンガポールご訪問の時のものではありません。日本庭園と植物園は Wikimedia Commons の場所の写真で、植樹された木や命名された蘭を写したものではありません。画面の隅に撮影日と行事を示しています。
- 本動画は、記録で確認できない発言や逸話は含めていません。公式に確認できる出来事と、当チャンネルの分析を区別してご覧ください。
