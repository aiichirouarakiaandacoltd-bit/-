note: '2026-11-26 デザイナー(重要): 荒木指示「表紙の画像を変更」により A113 から A167 に変更(台帳に追加・assets にコピー)。A167=宮内庁
  月別ご日程「ご覧・ご参加（令和8年度宮内庁防災訓練）（宮内庁庁舎）」令和8年9月1日、説明文「令和8年度宮内庁防災訓練にご参加になる天皇皇后両陛下並びに愛子内親王殿下」、666×1000、撮影者・提供者表記なし。消火ホースを一緒に持たれる私服の女性お二人(説明文の女性お二方=皇后陛下・愛子さま)の範囲に切り抜き、左端のヘルメット・作業服の職員は外した(お二人を一緒に入れ、お顔でどちらかを見分けることはしていない)。選んだ理由:
  宮内庁にシンガポールご訪問の写真は無い(2026sgp の御日程ページに写真なし、天皇ご一家のご活動・月別ご日程・ご訪問ページ番号616〜720も確認)。植樹・庭園・外国との親善の写真は、400px
  で関係者と離せない(鴨場の外交団接遇・万博)か、提供者表記あり(ラオスフェスティバル等)か、-02 と同じラオスか、過去の表紙・同じ日の撮影(園遊会・盆栽)だったため、直近の本編・表紙での使用0回の写真から、屋外で緑の中、皇后陛下と愛子さまが並ばれる穏やかな行事の場面(題名『受け継いでいく』の世代をつなぐ雰囲気)を選んだ。過去の全
  thumb.yaml と照合し未使用・同じ日の撮影もなし。加工はトリミング・拡大縮小のみ(約3.2倍)。3本並べで -02・-03 と見分けられることを確認。thumb_canva
  --fetch の検査(1080×1920・写真枠外の赤0)をA・Bとも通過。要確認: シンガポール・植樹・国際親善の場面ではない(写真下に年月日と行事を明記)。人物照合は説明文の女性の人数と服装(私服/作業服)によるもので当てっこ係の再確認待ち。'
