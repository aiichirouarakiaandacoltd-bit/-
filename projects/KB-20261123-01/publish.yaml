question_topic: 天皇陛下がお誕生日の記者会見で語られた雅子さまへの言葉
subject_area: 皇室、宮中行事
related_orgs: 宮内庁、皇室、その他の関係団体
body:
- 天皇陛下は即位後、令和2年から令和8年までの7回、お誕生日を前に記者会見に臨まれました。
- その7回のうち6回でくり返された、雅子さまについての言葉とは何でしょうか。
- 令和2年、即位後初めての会見では「支えてくれている皇后雅子に，感謝しております。」と述べられました。
- 令和3年から令和6年までは4年続けて「私の日々の活動を支えてくれる大切な存在」と語られ、ご結婚30年を経た令和6年には「この先の人生も引き続きよろしく」と伝えたいとも述べられました。
- 令和7年も英国ご訪問や全国赤十字大会など雅子さまについて語られましたが、「支え」という言い方はありませんでした。
- 令和8年は「雅子に支えてもらっていることも多くあり、深く感謝しています。」と述べられ、令和2年と同じく「支え」と「感謝」が入っています。
- 答えは「支え」。日々の生活でも公務の場でも、雅子さまは陛下の支えと言えそうだ、というのが当チャンネルの分析です。
- 今回の動画では、宮内庁の7回の会見全文をもとに、陛下の言葉を年の順にたどります。写真はすべて令和8年のもので、各年の会見の写真ではありません。
- 引用は会見全文と同じ文字で記し、宮内庁の記録で確認できない発言や逸話は含めていません。
- 公式に確認できる出来事と、当チャンネルの解説を区別してご覧ください。
