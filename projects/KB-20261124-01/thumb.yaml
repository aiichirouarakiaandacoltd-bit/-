note: 2026-11-24 再点検の直し(直し係)。3枚とも1280×720・型D。A=A049(左 皇后陛下/右 天皇陛下。帯「雅子さま34年ぶりのオックスフォード」)、B=A048(左 ガウン姿で式に臨まれる皇后陛下の寄り/右 式の会場。帯「陛下と雅子さまに」)、C=A047・A051(変更なし)。3パターンで同じ写真は使っていない。写真は宮内庁 英国ご訪問 報告7日目(2024-06-28・写真内の表記 John Cairns)。切り抜き・拡大縮小のみ。check_faces(お顔と文字の重なり・見切れ)と credit(クレジットと文字の重なり)は3枚とも通過し、目でも確認した(Bは皇后陛下のお姿が金の一言より上にあり、座っている参列者のお顔は文字の下に入っていない)。赤の装飾・絵文字・作り台詞・矢印・吹き出しなし(写真の中のアカデミックガウンと絨毯の赤は写真そのもの)。表紙のかぎかっこは宮内庁の原文の一部(「雅子にも」= F33、「唯一避ける話題」= F22)。文字は各題名の言葉から取っている。
