note: 2026-11-24 表紙Bの作り直し(直し係・決まりの確認係の指摘 rules_check.md ⑨)。3枚とも1280×720・型D。A=A049(左 皇后陛下/右 天皇陛下。帯「雅子さま34年ぶりのオックスフォード」・変更なし)、B=人物＋場所(左 A050 同じ6月28日にオックスフォード市内をご散策になるお二人/右 A048 名誉学位授与式の会場。帯「陛下と雅子さまに」)、C=A047・A051(変更なし)。3パターンで同じ写真は使っていない。写真は宮内庁 英国ご訪問 報告7日目(2024-06-28・写真内の表記 John Cairns)。切り抜き・拡大縮小のみ。Bの左はお二人のお顔の中間をパネルの中央(x320・y305)に置き、お顔の高さは約155px(175pxにすると天皇陛下の頭が左に見切れるため、幅640pxに収まる上限にした)。Bの右は写真が画面の下端まで届き、ぼかしで埋めた部分との境目はない。皇后陛下のお姿は金の一言より上、座っている参列者のお顔は切り抜きに入っていない。check_faces(お二人それぞれの頭の範囲で、文字との重なり・見切れ)と credit(クレジットと文字の重なり)は通過し、目でも確認した。赤の装飾・絵文字・作り台詞・矢印・吹き出しなし(写真の中のアカデミックガウンと絨毯の赤は写真そのもの)。表紙のかぎかっこは宮内庁の原文の一部(「雅子にも」= F33、「唯一避ける話題」= F22)。文字は各題名の言葉から取っている。
