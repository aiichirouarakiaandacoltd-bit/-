body:
- 令和6年6月28日、国賓として英国ご訪問中の天皇皇后両陛下は、お二人が留学されたオックスフォードを訪ねられました。陛下がのちに会見で「雅子にも授与していただき」と語られた、同じ博士号とは何だったのでしょうか。
- 最初の訪問先は、雅子さまが学ばれたベイリオル・コレッジ。昼食会で陛下は「唯一避ける話題は、マートンとベイリオルのどちらがオックスフォードで最古のコレッジかという問題です。」と述べられました。
- その後が、雅子さまの名誉学位授与式です。答えは、オックスフォード大学の名誉法学博士号。両陛下は同じアカデミックガウンで臨まれました。陛下も平成3年9月に、同じ博士号を受けられています。
- 後半は、重ならなかったお二人の留学時代、晩餐会とギルドホールのご答辞、桜の植樹式や陛下のお部屋を訪ねられた午後をたどり、3つのお言葉を並べます。「〜かもしれません」などは当チャンネルの分析です。
- 英国でのおことばの引用は宮内庁の和訳です。人物の写真は宮内庁の掲載写真で、別の日の写真には撮影日(ご近影は公表日)を表示。建物・風景は Wikimedia Commons の写真です。
