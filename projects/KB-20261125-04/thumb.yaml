note: '2026-11-25 荒木指示「全ていつも使用している画像です。変化がなく飽きてます」で中心画像を差し替え(デザイナー): A073→A109。A109(令和8年10月29日 園遊会(赤坂御苑)「ご歓談になる天皇皇后両陛下」、宮内庁キャプション、1000px)。A106(武道大会)はご一家が小さく一般の方が多いため不採用。要確認: 上段「平成14年の記者会見」に令和8年の写真(写真下に年月日と行事を明記)。中央の後ろ姿の方はキャプションに名前がない(お顔は写らない)。 加工はトリミング・拡大縮小のみ。thumb_canva --fetch の検査(1080×1920・写真枠外の赤0)をA・Bとも通過。 / 旧: 2026-11-25 荒木指示で中心画像を差し替え(デザイナー): 旧A025→A073(令和7年 新年をお迎えになったご一家のご近影、宮内庁、1800px)。雅子さまと愛子さまのお二人だけの範囲は中央に陛下が座られるため切り出せず、3名のまま使用。写真下に「令和7年」を明記(要確認:
  上段「平成14年の記者会見」と令和7年の写真の組み合わせ)。加工はトリミング・拡大縮小のみ。 / 旧: 3段はタイトルの文言をそのまま流用(足した言葉なし。上段10字・中段9字・下段10字、各1行。下段は文末の読点を省略)。中心画像A025(令和7年
  皇后陛下お誕生日に際してのご近影、宮内庁)。平成14年の写真A064等は240px級で粗いため依頼どおり近年のご近影を使い、写真下に撮影年を明記(要確認: 上段「平成14年の記者会見」と令和7年の写真の組み合わせ。3段に「雅子さま」の語なし、写真で示す)。背景の花に暗い赤紫の葉が入る(写真そのもの・着色なし、要確認)。加工はトリミング・拡大縮小のみ。'
