closing_question: ご家族が生まれた日、皆さまは何を思いましたか？
question_topic: 愛子さまご誕生の後の記者会見で雅子さまが語られたご出産のときのお気持ち
subject_area: 皇室、皇室の歴史
related_orgs: 宮内庁、皇室、その他の関係団体
body:
- 愛子さまは平成13年12月1日にお生まれになりました。ご誕生からおよそ4か月後の平成14年4月2日、皇太子同妃両殿下(当時)は東宮御所で、愛子さまのご誕生につき記者会見に臨まれました。
- 記者から、ご出産のときのお気持ちを尋ねられた雅子さまは、どのような一言を語られたのでしょうか。
- 雅子さまは、「本当に生まれてきてありがとうという気持ちで一杯になりました。」と語られ、続けて「今でも，その光景は，はっきりと目に焼き付いております。」と述べられました。
- 今回の動画では、宮内庁が公開している平成14年4月2日の記者会見の全文から、このお答えの一場面をたどります。お言葉は会見全文と同じ文字で記しています。「わが子を迎えた日の気持ちが表れた一言かもしれません」は当チャンネルの分析です。
- 雅子さまのお誕生日のご感想に書かれた愛子さまのことは、長い動画でたどります。あわせてご覧ください。
- 写真は、宮内庁が掲載している平成14年4月2日の記者会見のお写真、同じ平成14年の別の機会(12月5日の記者会見・愛子さま1歳のお誕生日に際しての文書回答)のお写真、雅子さまのお誕生日に際してのご近影(令和元年・令和2年・令和4年〜令和7年)、新年をお迎えになったご一家のご近影(令和7年・令和8年)です。4月2日の会見当日でない写真は、画面の隅に日付と行事を示しています。
- 本動画は、記録で確認できない発言や逸話は含めていません。公式に確認できる出来事と、当チャンネルの分析を区別してご覧ください。
