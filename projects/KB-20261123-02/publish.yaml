question_topic: 20年前にご一家で過ごした夏と今回のオランダご訪問
subject_area: 皇室、国際親善
related_orgs: 宮内庁、皇室、オランダ王室、政府機関、その他の関係団体
body:
- 平成18年の夏、当時の皇太子ご一家は、オランダのヘット・アウデ・ロー城で過ごされました。
- 20年後の令和8年6月11日、オランダ及びベルギーご訪問を前にした記者会見で、陛下はこの夏をどのように語られたのでしょうか。
- 陛下は「平成18年夏にはベアトリックス女王陛下からお招きをいただき、4歳の愛子を伴って家族揃って静養のためにヘッド・アウデ・ロー城に滞在させていただきました。」と述べられました。
- 滞在中は、当時のオランダ皇太子ご一家とも「家族ぐるみで」過ごされたと語られています。
- 陛下は、愛子さまにとって初めての外国訪問だったこの滞在について、お堀の黒鳥に餌をやったことなど「今でも非常にその当時のことを鮮明に覚えているようです。」と紹介されました。
- 令和8年6月13日、両陛下は国賓としてオランダに到着され、6月16日までヘット・アウデ・ロー城に滞在されました。宮内庁の報告によると、20年ぶりの城で非常に懐かしく思われたそうです。
- 6月17日、アムステルダム王宮の晩餐会で英語で述べられたおことばの和訳(宮内庁掲載)には「20年前に愛子が毎日のようにパンを与えていた一羽の黒鳥とも再会しました。」とあります。
- 20年前は、ご一家での静養でした。今回は、国賓としてのご訪問でした。
- 陛下が会見で語られた思い出は、ご一家で過ごしたお城の夏の思い出でした。ご一家どうしの交流が両国の友好を支え、今も続く絆の証しかもしれない、というのが当チャンネルの分析です。
- 今回の動画では、宮内庁の会見全文・おことば(和訳)・ご訪問の報告をもとに、20年前の夏と今回のご訪問をたどります。写真はすべて令和8年6月のもので、平成18年の滞在の写真ではありません。
- 引用は宮内庁の掲載文と同じ文字で記し、記録で確認できない発言や逸話は含めていません。
- 公式に確認できる出来事と、当チャンネルの解説を区別してご覧ください。
