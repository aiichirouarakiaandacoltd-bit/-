# G6③ 説明文係 2026-11-23: 本文は facts.md の公式事実(F5〜F16・F20)と引用可の範囲だけ。温室は国王ご夫妻の名を付けない(要注意4)。会話・お気持ち・空港のお見送りは書かない(要注意7・9)。
question_topic: お別れの日にラーケン宮で両陛下が国王ご夫妻と過ごされた時間
subject_area: 皇室、国際親善
related_orgs: 宮内庁、皇室、ベルギー王室、政府機関、その他の関係団体
body:
- 令和8年6月25日は、天皇皇后両陛下がベルギーをご出発になった、お別れの日です。
- この日、両陛下はフィリップ国王陛下・マチルド王妃陛下とどのような時間を過ごされたのでしょうか。
- 舞台は、ラーケン宮です。宮内庁の報告には「ブリュッセル北西部に位置する国王ご一家のお住まいです。」とあります。
- 6月25日の午前、宮内庁の報告には「天皇皇后両陛下は、フィリップ国王陛下及びマチルド王妃陛下とラーケン宮の庭園をご散策になりました。「日本の塔」と呼ばれる五重塔や様々な植物をご覧になりました。」とあります。両陛下は、ラーケン宮の温室もご散策になりました。
- 続けて「ご散策後、両陛下は、国王王妃両陛下とお別れのご挨拶をされました。」と記されています。このとき交わされた言葉は、記録にありません。
- では、国王ご夫妻と過ごされた時間とは。答えは、庭園のご散策とお別れのご挨拶です。お住まいの庭でのご散策は、親しさの表れかもしれない、というのが当チャンネルの分析です。
- 今回の動画は、お別れの日のラーケン宮の一場面だけを、宮内庁のご日程とご訪問の報告をもとにたどります。別の日の写真を使った場面では、画面に実際の撮影日と行事を表示しています。
- ラーケン宮・日本の塔・庭園の写真の一部は Wikimedia Commons の写真で、画面に撮影日・作者・ライセンスを表示しています。
- 引用は宮内庁の掲載文と同じ文字で記し、記録で確認できない会話や逸話は含めていません。
- 公式に確認できる出来事と、当チャンネルの解説を区別してご覧ください。
