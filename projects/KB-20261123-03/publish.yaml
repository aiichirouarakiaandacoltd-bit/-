title: "【ベルギー国王ご夫妻と両陛下】お別れの日、ラーケン宮で両陛下が国王ご夫妻と過ごされた時間とは？宮内庁の記録から #天皇陛下 #雅子さま #ベルギー"
closing_question: 心に残ったのは、晩餐会と庭園のどちらですか？
