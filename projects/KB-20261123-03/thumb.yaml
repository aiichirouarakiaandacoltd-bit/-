texts:
  upper: お別れの日、ラーケン宮で
  middle: 過ごされた時間とは？
  lower: ベルギー国王ご夫妻と両陛下
photos:
- ledger: A104
center_image: A104
note: 3段はタイトルの文言から流用(足した言葉なし。中段10字・金・1行)。A104(koho_nld-bel86、宮内庁写真説明「お別れのご挨拶をされる天皇皇后両陛下」、当てっこ係が目視照合済み)。天皇陛下・皇后陛下のお顔は大きく分かる。国王陛下は横顔、王妃陛下はお顔が皇后陛下と重なり見えない(要確認)。トリミング案は
  x300〜960・y30〜450(胸から上)で、右下の車のテールランプの赤(x785〜910・y455〜500)と車体の大半を切る。加工はトリミング・拡大縮小・明るさの軽い補正のみ。写真の表情・しぐさから内心を読む文言は入れない。人物4人は第5章「1〜2人」を超える(依頼による例外・要確認)。別案A030(4人のお顔が見えるが小さい。左の消火栓の赤はx235以上で切る)
layout: S-A
