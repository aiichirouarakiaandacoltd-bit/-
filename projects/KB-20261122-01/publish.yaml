# 説明文係 2026-11-22: body は facts.md の公式事実(F1〜F23)のみ。マラソンランナーの名前は出さない(F14)。「次の世代へつなぐ」は分析(F24)と明記
question_topic: "両陛下の青森ご訪問の2日間"
subject_area: "皇室、スポーツ、地域の伝統文化"
related_orgs: "宮内庁、皇室、政府機関、青森県・青森市などの地方自治体、国民スポーツ大会の主催者、各訪問先の施設、報道機関その他の関係団体"
body:
  - "2026年10月10日と11日、天皇皇后両陛下は第80回国民スポーツ大会にご臨場、併せて地方事情ご視察のため、青森県をご訪問になりました。宮内庁によると、両陛下の青森県ご訪問はご即位後初めてです。"
  - "2日間の行程で、両陛下はどのようなことに心を寄せられたのでしょうか。"
  - "10日は、青森市で開かれた総合開会式にご臨席。災害などにより犠牲となられた方々に黙とうを捧げられた後、天皇陛下がおことばを述べられました。"
  - "大会関係者とのご懇談では、天皇陛下がマラソンランナーに、過去に20km走られたことをお話しになるなど、和やかにご懇談になりました。"
  - "11日は、卓球競技をご覧になり、選手の健闘に拍手を送られました。ボランティアの高校生の卓球選手たちもお労いになりました。"
  - "あおもり駅前ビーチでは、旧青函連絡船の発着地だった岸壁をかつての砂浜に再生するための地域の人々の取組について、関心深くお聞きになりました。"
  - "ねぶたの家 ワ・ラッセでは、第7代ねぶた名人の説明を受けられ、ねぶた囃子の演奏者たちとご交流になり、祭りの継承に取り組む若い方々をお励ましになりました。"
  - "ヴァンピュール南青森では、高齢者と子供たちが交流する様子を温かく見守られました。"
  - "両陛下は、お二人そろって青森県を訪れることができ、うれしく思われ、県民の温かい迎えに心から感謝されました。"
  - "今回のショート動画では、宮内庁の公式記録をもとに、両陛下の青森での2日間を時系列でたどります。終盤の、次の世代へつなぐ取組に心を寄せられたという見方は、宮内庁の記述をもとにした当チャンネルの分析で、宮内庁の文言ではありません。"
  - "なお、本動画では宮内庁の公式記録で確認できた出来事のみを紹介しており、各場面でのご発言の内容や詳しいご様子は含めていません。"
  - "公式に確認できる出来事と、当チャンネルによる構成・解説を区別してご覧ください。"
