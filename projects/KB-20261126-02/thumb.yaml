note: '2026-11-26 デザイナー(重要): 3段はタイトルの文言をそのまま流用(足した言葉・呼びかけなし)。A091(宮内庁「天皇ご一家のご活動」掲載、説明文「国家主席を表敬された愛子内親王殿下
  （ラオス）」、同じ行事のラオスご訪問ページの日付は令和7年11月18日、1000×666、撮影者・提供者表記なし)。ラオスの伝統衣装で金の椅子に座られ、ほほえまれる横顔。右の国家主席(皇族方以外)と左の日本国旗は切り抜きで外した(国旗の赤が
  thumb_canva の赤検査に掛かったため切り抜きを右へ寄せた)。写真に皇族方以外の人物は体の一部も入らないことを確認。 過去の全 thumb.yaml の写真(取得元URL)と照合し未使用・同じ日の撮影もなし。お誕生日・新年のご近影ではなく行事の場面。加工はトリミング・拡大縮小のみ。3本(-02
  A091 金の椅子・ラオスの衣装/-03 A133 桜の金屏風・ベージュのコート・立ち姿/-04 A113 盆栽・ピンクの装いと皇后陛下)を縮小して並べ、写真・服装・背景で見分けられることを確認(projects/KB-20261126-01/thumb/shorts_02-04_covers_overview.jpg)。thumb_canva
  --fetch の検査(1080×1920・写真枠外の赤0)をA・Bとも通過。要確認: A091 の人物の照合は親台帳の『キャプション』(制作係 2026-11-26)のみで、当てっこ係の照合済み印はない(説明文の名前は愛子内親王殿下・国家主席の2名で写る方2名と一致)。愛子さまのお顔は横向きでやや小さい(元の写真で約45px→約2.4倍に拡大)。'
