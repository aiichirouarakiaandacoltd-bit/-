note: '2026-11-26 荒木指示で写真を差し替え(デザイナー(重要)): 1枚の写真枠を左右2分割し、左に A179(宮内庁 タートルアン大塔ご視察 597/image4、説明文なし・お一人・正面を向いたほほえみの寄り)、右に A086(同ページ 597/image5、説明文「タートルアン大塔をご視察になる愛子内親王殿下」、合掌の場面。左の女性・右の合掌の女性と男性は体の一部も入らないよう愛子さまお一人の範囲に切り抜き)。どちらも令和7年11月18日・ラオスの衣装(白い上着・紫の縞の肩掛け)。2枚の間は濃紺16px。合成画像
  thumb/A179_A086_pair.jpg(1320×1290、トリミング・拡大のみ)を写真枠に update_fill。撮影情報は「令和7年11月18日 タートルアン大塔(ラオス)／宮内庁」に変更。文字・配色・配置は不変。元は400pxのため約4.8〜5.4倍の拡大で粗い(荒木指示で許容)。大きい版は宮内庁サイト(同じURLの別サイズ・天皇ご一家のご活動・英語版)で見つからなかった。thumb_canva
  --fetch の検査(1080×1920・写真枠外の赤0)をA・Bとも通過。要確認: A179 は説明文がなく、人物の照合はページ題名と同じページの説明付き写真 A086 との装い一致による(当てっこ係の照合印なし)。 3本並べ確認画像 projects/KB-20261126-01/thumb/shorts_02-04_covers_overview.jpg を作り直し、-02(2枚並び・タートルアン大塔の金色の壁)・-03・-04
  が写真・背景で見分けられることを確認。 / 差し替え前の記録: 2026-11-26 デザイナー(重要): 3段はタイトルの文言をそのまま流用(足した言葉・呼びかけなし)。A091(宮内庁「天皇ご一家のご活動」掲載、説明文「国家主席を表敬された愛子内親王殿下 （ラオス）」、同じ行事のラオスご訪問ページの日付は令和7年11月18日、1000×666、撮影者・提供者表記なし)。ラオスの伝統衣装で金の椅子に座られ、ほほえまれる横顔。右の国家主席(皇族方以外)と左の日本国旗は切り抜きで外した(国旗の赤が
  thumb_canva の赤検査に掛かったため切り抜きを右へ寄せた)。写真に皇族方以外の人物は体の一部も入らないことを確認。 過去の全 thumb.yaml の写真(取得元URL)と照合し未使用・同じ日の撮影もなし。お誕生日・新年のご近影ではなく行事の場面。加工はトリミング・拡大縮小のみ。3本(-02 A091 金の椅子・ラオスの衣装/-03 A133 桜の金屏風・ベージュのコート・立ち姿/-04
  A113 盆栽・ピンクの装いと皇后陛下)を縮小して並べ、写真・服装・背景で見分けられることを確認(projects/KB-20261126-01/thumb/shorts_02-04_covers_overview.jpg)。thumb_canva --fetch の検査(1080×1920・写真枠外の赤0)をA・Bとも通過。要確認: A091 の人物の照合は親台帳の『キャプション』(制作係 2026-11-26)のみで、当てっこ係の照合済み印はない(説明文の名前は愛子内親王殿下・国家主席の2名で写る方2名と一致)。愛子さまのお顔は横向きでやや小さい(元の写真で約45px→約2.4倍に拡大)。'
