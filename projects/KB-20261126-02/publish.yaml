closing_question: ラオスご訪問で、心に残った場面はどれですか？
question_topic: ラオスご訪問の晩餐会で愛子さまが述べられたおことば
subject_area: 皇室、国際親善
related_orgs: 宮内庁、皇室、ラオス政府、その他の関係団体
body:
- 令和7年11月、愛子さまは日本とラオスの外交関係樹立70周年の機会に、ラオス政府の招待を受けてラオスを訪問されました。愛子さまにとって初めての外国公式訪問です。
- 初めての外国公式訪問の晩餐会で、愛子さまはどのような一節を述べられたのでしょうか。
- ご訪問は、令和7年10月17日の閣議了解で、11月17日ご出発、22日ご帰国の日程と決まりました。11月18日、愛子さまは凱旋門やタートルアン大塔をご視察になり、国家主席表敬などを経て、その日の最後の行事として国家副主席主催晩餐会に臨まれました。
- 晩餐会のおことばでは、「今日の日本とラオス両国の深い友好と幅広い協力関係は、長年にわたる両国の先人たちによる努力の積み重ねの上にあることを忘れてはなりません。」と述べられています。この次の文の中で述べられたのが、今回の動画で紹介する一節です。11月20日にはルアンパバーンで午餐会に臨まれ、11月22日にはご訪問を終えてのご感想を文書でつづられました。
- 今回の動画では、宮内庁が公開しているおことばの全文から、この一節を紹介します。お言葉は宮内庁の公表文と同じ文字(「懸け橋」など)で記しています。「歩みを受け継ぐ思いが表れた一節と言えるのかもしれません」は当チャンネルの分析です。
- 愛子さまの25年の歩みは、長い動画「愛子さま25年の軌跡」でたどります。あわせてご覧ください。
- 写真は、宮内庁が掲載しているラオスご訪問(令和7年11月18日〜21日)の各行事のお写真です。晩餐会以外の場面の写真もあるため、画面の隅に撮影日と行事を示しています。
- 本動画は、記録で確認できない発言や逸話は含めていません。公式に確認できる出来事と、当チャンネルの分析を区別してご覧ください。
