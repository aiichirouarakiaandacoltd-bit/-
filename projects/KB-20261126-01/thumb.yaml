note: >-
  2026-11-26 タイトル係: 長尺の表紙3枚を新規作成。写真は過去の全 thumb.yaml(projects/*)と直近の本編(projects/KB-202611*/scenes.json)を
  各台帳の取得元URLで照合し、4枚とも表紙0回・本編0回(この長尺の本編でも0回)。A168・A169・A170 は KB-20261125-01 の A051・A054・A056 を
  台帳に流用追加(照合は流用元のまま。年の裏付けがないため年は表示しない=事実確認 M6。クレジットはページ名どおり)。
  行事の写真を優先したが、長辺1000px以上・提供者表記なし・皇族方以外を外せる・未使用の条件を満たす愛子さまの行事写真は A102 だけだった
  (A128/A129 は提供者表記あり、A087 雅楽は後ろに関係者のお顔、A120 茶会はお顔が小さく拡大しすぎ、A113・A133・A167 は直近のショートの表紙で使用)。
  献花・慰霊・被災地の写真は使っていない。check_faces・credit は3枚とも通過。3枚と overview.jpg を開いて目で確認し、写真・構図・人物の位置・文字の位置で見分けられることを確かめた。
  要確認: A の左の額(A168)は赤いタートルネックのお召し物が写る(写真の中の服装で、赤の装飾ではない)。A102 は約2.1倍の拡大でやや柔らかい。B・C はご近影(行事の写真ではない)。
