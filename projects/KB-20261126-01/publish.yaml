closing_question: 皆さまの心に残ったのは、どの時のお言葉ですか？
question_topic: 成年から25歳のお誕生日までに、愛子さまが重ねてこられた「初めて」
subject_area: 皇室、皇室の歴史、国際親善
related_orgs: 宮内庁、皇室、日本赤十字社、ラオス政府、シンガポール政府、その他の関係団体
body:
- 令和8年12月1日、愛子さまは25歳のお誕生日を迎えられました。令和3年12月1日の成年から、ちょうど5年です。
- この5年間に、愛子さまはどんな「初めて」を重ねてこられたのでしょうか。
- 令和3年12月の勲章、令和4年の新年祝賀の儀と記者会見、令和6年の宮中午餐、伊勢の神宮と神武天皇山陵へのご参拝、佐賀県でのご公務、令和7年の能登半島地震の被災地へのご訪問、ラオスへの初めての外国公式訪問と続き、令和8年11月には2度目の外国公式訪問としてシンガポールを訪れられました。
- 今回の動画では、宮内庁のホームページに載っているご本人と両陛下のお言葉から、この動画で拾えた8つの「初めて」と、その時々のお言葉を原文のままたどります。
- ショート動画からお越しの皆さまへ。ラオス、日本赤十字社、シンガポールの場面が、25年の歩みのどこにあたるのかをご覧いただけます。
- 「8つ」は当チャンネルが宮内庁の掲載文から数えた数で、「〜かもしれません」は当チャンネルの分析です。本動画は、記録で確認できない発言や逸話は含めていません。公式に確認できる出来事と、当チャンネルの分析を区別してご覧ください。
- '【目次】

  0:00 「私も受け継いでいくことができれば」 どんな「初めて」を重ねてこられたのか

  0:29 平成13年12月1日 第1皇女子のご誕生

  0:58 1つ目から3つ目 勲章、新年祝賀の儀、「初めての記者会見」

  1:44 4つ目と5つ目 初めての宮中午餐と、伊勢の神宮・神武天皇山陵への参拝

  2:25 6つ目 佐賀県 お一人で臨まれた国民スポーツ大会

  2:56 7つ目 能登半島地震の被災地へ

  3:25 8つ目 ラオス 初めての外国公式訪問

  3:53 8つの「初めて」とは？

  4:29 その時々に、どんな言葉を残されたのか？ 成年のご感想と記者会見

  5:52 「国民と苦楽を共に」 2年を隔てた同じ言葉

  6:33 ラオスの晩餐会 「先人たちの歩みを受け継ぎ」

  7:41 シンガポール 1970年のソテツの隣に

  9:50 25歳のお誕生日 8つの「初めて」の先に'
