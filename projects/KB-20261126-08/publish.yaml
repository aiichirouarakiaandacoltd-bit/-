closing_question: シンガポールの文化で、気になるものはありますか？
question_topic: ホーカーセンターで愛子さまが触れられたもの
subject_area: 皇室、国際親善
related_orgs: 宮内庁、皇室、シンガポール政府、その他の関係団体
body:
- 令和8年11月17日から21日まで、愛子さまは日本とシンガポールの外交関係樹立60周年の機会に、ターマン大統領のお招きでシンガポールを公式訪問されました。愛子さまにとって2度目の外国公式訪問です。
- ご訪問を終えての11月21日のご感想に書かれた、ラオパサ・ホーカーセンターで愛子さまが触れられたものとは、何だったのでしょうか。
- ご感想には、「ラオパサ・ホーカーセンターでは、様々な民族の文化が共存するシンガポールの多様性に富んだ社会の一端に触れることができました。」とつづられています。
- 今回の動画では、宮内庁が公表したご感想の全文から、この一文をたどります。訪れた日時や召し上がったものなど、宮内庁の公表文にない内容は扱っていません。「4つの言葉で始まった午餐会のおことばとも、響き合う一文かもしれません」は当チャンネルの分析です。
- 愛子さまのこれまでの歩みは、長い動画でたどります。あわせてご覧ください。
- 宮内庁にはシンガポールご訪問のお写真がまだ掲載されていないため、人物の写真は宮内庁が掲載している別の日のご公務やご近影のお写真(前年のラオスご訪問を含む)で、シンガポールご訪問の時のものではありません。画面の隅に撮影日と行事を示しています。シンガポールの場所の写真は
  Wikimedia Commons のもので、撮影年・作者・ライセンスを画面に示しています。
- 本動画は、記録で確認できない発言や逸話、現地の方々の反応などは含めていません。公式に確認できる出来事と、当チャンネルの分析を区別してご覧ください。
