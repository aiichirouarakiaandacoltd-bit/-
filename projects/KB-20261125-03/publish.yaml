title: '【雅子さまのお誕生日のご感想】愛子さまが成年を迎えた年に書かれた一文とは？ #雅子さま #愛子さま #皇室'
# G6② デザイナー(重要) 2026-11-25: 3段はタイトルの文言をそのまま流用(足した言葉なし)。
thumb:
  upper: 雅子さまのお誕生日のご感想
  middle: 書かれた一文とは？
  lower: 愛子さまが成年を迎えた年に
