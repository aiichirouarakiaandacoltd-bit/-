texts:
  upper: 雅子さまのお誕生日のご感想
  middle: 書かれた一文とは？
  lower: 愛子さまが成年を迎えた年に
photos:
- ledger: A155
center_image: A155
note: '2026-11-25 荒木指示「S2の画像を差し替え。誕生日にご供花の画像はなし。もっと華やかな画像にしなさい」と追加指示「皇族方以外の人物は後ろ姿・体の一部も含めて一切入れない」。中心画像
  A099→A155(令和8年6月20日 オランダ及びベルギーご訪問 アムステルダム(スキポール空港)御発「政府専用機にご搭乗になる天皇皇后両陛下」、宮内庁キャプション、1000px、撮影者・提供者表記なし)。明るい黄緑のお召し物の皇后陛下と天皇陛下が笑顔で手を振られる場面。写る方は両陛下のみ(説明文の2方と一致)で、ほかの人物は体の一部も入らない。雅子さま・愛子さまのお二人がそろい、皇族以外が一切入らない1000px以上の写真は今回の範囲では1枚(A156)しかなく、母娘の写真は
  S3 に回した(要確認: S2 は愛子さまが写らない両陛下の写真)。要確認: 上段「雅子さまのお誕生日のご感想」(令和3年の話)に令和8年の行事の写真(写真下に年月日と行事を明記)。加工はトリミング・拡大縮小のみ。thumb_canva
  --fetch の検査(1080×1920・写真枠外の赤0)をA・Bとも通過。 / 旧: 2026-11-25 荒木指示「全ていつも使用している画像です。変化がなく飽きてます」で中心画像を差し替え(デザイナー):
  A059→A099。A099(令和8年4月6日 東日本大震災・原子力災害伝承館(双葉町)で「ご供花になる天皇皇后両陛下並びに愛子内親王殿下」、宮内庁キャプション、1000px)。A100は説明役の方が大きく写りご一家が小さい、A101は一般の方が並ぶため、雅子さまと愛子さまが写るA099を採用。要確認:
  上段「雅子さまのお誕生日のご感想」(令和3年の話)に令和8年の行事の写真(写真下に年月日と行事を明記)。お三方が伏し目(ご供花の所作)の写真。 加工はトリミング・拡大縮小のみ。thumb_canva
  --fetch の検査(1080×1920・写真枠外の赤0)をA・Bとも通過。 / 旧: 2026-11-25 荒木指示で中心画像を差し替え(デザイナー): S2とS3が同じ見た目(雅子さまお一人・白い装い・花)だったため、旧A014→A059(令和7年12月1日掲載
  愛子内親王殿下のお誕生日に際してのご近影、宮内庁、1000px)。題材が愛子さまの成年のため愛子さまを主役に。令和3年のA043/A044は400pxで粗いため不採用。A059は親
  KB-20261125-01 の台帳から本台帳・assets に写した。写真下に「令和7年」を明記(要確認: 令和3年の話に令和7年の写真)。加工はトリミング・拡大縮小のみ。
  / 旧: 3段はタイトルの文言をそのまま流用(足した言葉なし。上段13字・中段9字・下段13字、各1行)。中心画像A014(令和5年 皇后陛下お誕生日に際してのご近影、宮内庁)。話題の令和3年のご近影A007・A032は266×400pxで表紙には粗いため、近年の高解像度ご近影を使い、写真下に撮影年を明記(要確認:
  令和3年の話に令和5年の写真)。加工はトリミング・拡大縮小のみ。'
