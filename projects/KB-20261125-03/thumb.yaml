note: '2026-11-25 荒木指示で中心画像を差し替え(デザイナー): S2とS3が同じ見た目(雅子さまお一人・白い装い・花)だったため、旧A014→A059(令和7年12月1日掲載
  愛子内親王殿下のお誕生日に際してのご近影、宮内庁、1000px)。題材が愛子さまの成年のため愛子さまを主役に。令和3年のA043/A044は400pxで粗いため不採用。A059は親
  KB-20261125-01 の台帳から本台帳・assets に写した。写真下に「令和7年」を明記(要確認: 令和3年の話に令和7年の写真)。加工はトリミング・拡大縮小のみ。
  / 旧: 3段はタイトルの文言をそのまま流用(足した言葉なし。上段13字・中段9字・下段13字、各1行)。中心画像A014(令和5年 皇后陛下お誕生日に際してのご近影、宮内庁)。話題の令和3年のご近影A007・A032は266×400pxで表紙には粗いため、近年の高解像度ご近影を使い、写真下に撮影年を明記(要確認:
  令和3年の話に令和5年の写真)。加工はトリミング・拡大縮小のみ。'
