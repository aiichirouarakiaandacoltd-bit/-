title: '【愛子さま】シンガポール大統領の午餐会 4つの言葉で伝えられたあいさつは… #愛子さま #シンガポール #皇室'
title_before_20261126: '【愛子さま】シンガポール大統領の午餐会 おことばの最初に4つの言葉で伝えられたあいさつとは？ 宮内庁の全文から #愛子さま
  #シンガポール #皇室'
